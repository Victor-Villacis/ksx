name: Build installer

# The shippable `ksx.exe`, its console-free customer launcher, and the
# `setup.exe` and licensed portable ZIP a customer downloads, defined once and
# called from two places:
#
#   ci.yml       every branch — an installer that stopped building is found the
#                day it breaks, not the day someone tries to ship;
#   release.yml  a `v*` tag — the installer and portable ZIP become assets.
#
# A reusable workflow rather than a copy, because "what CI proves" and "what a
# customer downloads" must be the same build. If you need a third caller, add a
# caller — not a second copy of these steps.
#
# ---------------------------------------------------------------------------
# Why the shippable binary is built on a clean runner
# ---------------------------------------------------------------------------
#
# Release artifacts must be traceable to one commit, the pinned toolchain and
# the locked dependency graph. A clean runner excludes developer-host state,
# cached outputs and local configuration from that evidence, while making the
# exact build available to contributors who do not have the release toolchain.
# Local release builds remain useful diagnostics, but they are never uploaded
# or substituted for the artifact produced here.

on:
  workflow_call:
    inputs:
      release_tag:
        description: >
          The tag being released, e.g. `v0.2.0`, when this build is about to
          become a GitHub Release. Empty for an ordinary CI build. When set, the
          build FAILS unless the tree already carries that exact version — see
          the "Version agreement" step.
        type: string
        default: ''
    outputs:
      setup_name:
        description: The installer's filename, e.g. `ksx-0.2.0-setup.exe`.
        value: ${{ jobs.build.outputs.setup_name }}
      setup_sha256:
        description: SHA-256 of the installer, as built.
        value: ${{ jobs.build.outputs.setup_sha256 }}
      exe_sha256:
        description: SHA-256 of the bare ksx.exe, as built.
        value: ${{ jobs.build.outputs.exe_sha256 }}
      portable_name:
        description: The portable ZIP filename.
        value: ${{ jobs.build.outputs.portable_name }}
      portable_sha256:
        description: SHA-256 of the portable ZIP, as built.
        value: ${{ jobs.build.outputs.portable_sha256 }}
      manifest_name:
        description: The exact-candidate manifest filename.
        value: ${{ jobs.build.outputs.manifest_name }}
      manifest_sha256:
        description: SHA-256 of the exact-candidate manifest.
        value: ${{ jobs.build.outputs.manifest_sha256 }}

permissions:
  contents: read

# A called workflow does NOT inherit the caller's workflow-level env, so this is
# repeated here rather than relied upon from ci.yml.
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-2022
    outputs:
      setup_name: ${{ steps.installer.outputs.name }}
      setup_sha256: ${{ steps.installer.outputs.sha256 }}
      exe_sha256: ${{ steps.exe.outputs.sha256 }}
      portable_name: ${{ steps.portable.outputs.name }}
      portable_sha256: ${{ steps.portable.outputs.sha256 }}
      manifest_name: ${{ steps.candidate_manifest.outputs.name }}
      manifest_sha256: ${{ steps.candidate_manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      # ---------------------------------------------------------------------
      # The tag and the tree must already agree. WE FAIL; WE DO NOT DERIVE.
      # ---------------------------------------------------------------------
      #
      # The alternative was to overwrite `#define AppVersion` from the tag at
      # build time. Rejected, for three reasons:
      #
      # 1. That version is not just a filename. It is `VersionInfoVersion`, the
      #    "ksx 0.2.0" row in Apps & Features, and the uninstaller's display
      #    name — i.e. what the INSTALLED program says about itself, forever.
      # 2. A derived version cannot be rebuilt. `packaging\ksx.iss`'s own header
      #    tells you to run `iscc packaging\ksx.iss`; if CI patched the version
      #    in, that command would emit a different file than the one on the
      #    releases page, and nobody could reproduce or diff a shipped artifact.
      # 3. The tag is not the only other copy. `Cargo.toml`'s
      #    `[workspace.package] version` stamps `ksx --version`. Deriving the
      #    .iss from the tag would leave that one free to drift, which MOVES the
      #    disagreement rather than removing it.
      #
      # So one rule covers all three: the tag says what the tree already says.
      # The cost of being wrong is one new version commit and candidate tag.
      # Release tags are immutable evidence even when their candidate fails;
      # deleting or moving one is forbidden. The cost of a silent version is a
      # user holding a setup.exe whose About box disagrees with its release.
      #
      # `crates/ksx-app/tests/installer.rs` pins .iss == Cargo.toml on every
      # test run, so the only thing left to check here is the tag — and it is
      # checked BEFORE the 10-minute build, so a mistyped tag costs seconds.
      - name: Version agreement (tag vs packaging/ksx.iss vs Cargo.toml)
        if: inputs.release_tag != ''
        shell: pwsh
        # Through the environment, not `${{ }}` string interpolation: a tag name
        # is attacker-controllable in principle and would otherwise be pasted
        # into a PowerShell script.
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $want = $tag -replace '^v', ''
          # Inno Setup's VersionInfoVersion is a numeric Windows version
          # resource: `0.2.0-rc1` is not expressible, so a tag carrying a
          # suffix could never agree with the .iss. Say that here, in one
          # second, rather than as an ISCC error ten minutes in.
          if ($want -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            $bad = "tag '$tag' is not a numeric version tag (expected v<major>.<minor>.<patch>). " +
                   "ksx has no prerelease channel: Inno Setup's VersionInfoVersion cannot hold a suffix."
            throw $bad
          }

          $iss = Get-Content 'packaging/ksx.iss' -Raw
          if ($iss -notmatch '(?m)^#define\s+AppVersion\s+"([^"]+)"') {
            throw 'packaging/ksx.iss has no `#define AppVersion "..."` line.'
          }
          $issVersion = $Matches[1]

          $cargo = Get-Content 'Cargo.toml' -Raw
          if ($cargo -notmatch '(?s)\[workspace\.package\][^\[]*?version\s*=\s*"([^"]+)"') {
            throw 'Cargo.toml has no [workspace.package] version.'
          }
          $cargoVersion = $Matches[1]

          Write-Host "tag           $tag  (version $want)"
          Write-Host "ksx.iss       $issVersion"
          Write-Host "Cargo.toml    $cargoVersion"
          if ($issVersion -ne $want -or $cargoVersion -ne $want) {
            $lines = @(
              "the tag and the tree disagree about the version."
              "  tag $tag says          $want"
              "  packaging/ksx.iss says $issVersion   (#define AppVersion)"
              "  Cargo.toml says        $cargoVersion   ([workspace.package] version)"
              ''
              "Nothing has been built. Do not delete or move immutable $tag."
              "Fix the tree, increment the version, merge it, and cut a new tag."
            )
            throw ($lines -join "`n")
          }

      # rust-toolchain.toml pins the exact compiler; `rustup show` installs it.
      # NOT dtolnay/rust-toolchain: that action exports RUSTUP_TOOLCHAIN, which
      # overrides the pin.
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build pinned production HIDMaestro host
        shell: pwsh
        run: |
          $receipt = ./tools/hidmaestro-host/publish.ps1 `
            -WorkspaceRoot $PWD `
            -OutputDirectory (Join-Path $PWD 'target/release')
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro host publish failed' }
          $parsed = $receipt | Select-Object -Last 1 | ConvertFrom-Json
          if ($parsed.schemaVersion -ne 1 -or
              $parsed.upstreamCommit -cne '2a0dac0857901a63d365a36dcf99cf50114ca954' -or
              $parsed.runtimeContractSha256 -cne '4F76F31C049390A1342388E09F9D0D0E3547162D08EA501FD829AF3CF64F67DA' -or
              $parsed.executableSha256 -notmatch '^[A-F0-9]{64}$') {
            throw 'The HIDMaestro host build receipt is not exact.'
          }
          Write-Host "ksx-hidmaestro-host.exe SHA256 $($parsed.executableSha256)"

      - name: Build pinned HIDMaestro driver installer
        shell: pwsh
        run: |
          $receipt = ./tools/hidmaestro-driver-installer/publish.ps1 `
            -WorkspaceRoot $PWD `
            -OutputDirectory (Join-Path $PWD 'target/release')
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro driver installer publish failed' }
          $parsed = $receipt | Select-Object -Last 1 | ConvertFrom-Json
          if ($parsed.schemaVersion -ne 1 -or
              $parsed.upstreamVersion -cne '1.6.1' -or
              $parsed.upstreamArchiveSha256 -cne '00145C23D9838BE6089389CE58B3FD2B6766FA9BC0F1F3C60A3C885361B53C34' -or
              $parsed.distributionMode -cne 'runtime-hash-pinned-download' -or
              $parsed.bundledUpstreamAssemblyCount -ne 0 -or
              $parsed.requiresNetworkAtInstall -ne $true -or
              $parsed.executableSha256 -notmatch '^[A-F0-9]{64}$') {
            throw 'The HIDMaestro driver installer build receipt is not exact.'
          }
          Write-Host "ksx-hidmaestro-driver-installer.exe SHA256 $($parsed.executableSha256)"

      # The official SDK is allowed only inside the explicit, opt-in setup-time
      # download worker. It must never become part of the installed runtime.
      # The v1.6.1 SDK embeds Microsoft WDK tools plus driver/USB-IP payloads;
      # this gate inspects the artifacts that Inno will consume, not a
      # synthetic fixture describing what we hoped to build.
      - name: Enforce the HIDMaestro runtime distribution boundary
        shell: pwsh
        run: |
          $release = Resolve-Path 'target/release'
          $forbiddenNames = @(
            'ksx-hidmaestro-sdk-host.exe'
            'HIDMaestro.Core.dll'
            'Microsoft.Windows.SDK.NET.dll'
            'WinRT.Runtime.dll'
            'signtool.exe'
            'Inf2Cat.exe'
            'USBip-0.9.7.7-x64.exe'
          )
          $forbidden = Get-ChildItem -LiteralPath $release -Recurse -File |
            Where-Object Name -In $forbiddenNames
          if ($forbidden) {
            throw "forbidden HIDMaestro runtime payload: $($forbidden.FullName -join ', ')"
          }

          $host = Join-Path $release 'ksx-hidmaestro-host.exe'
          $bytes = [IO.File]::ReadAllBytes($host)
          $asciiView = [Text.Encoding]::Latin1.GetString($bytes)
          $utf16View = [Text.Encoding]::Unicode.GetString($bytes)
          $tokens = @(
            'HIDMaestro.Resources.signtool.exe'
            'HIDMaestro.Resources.Inf2Cat.exe'
            'HIDMaestro.Resources.USBip-0.9.7.7-x64.exe'
            'HIDMaestro.Internal.DriverBuilder'
            'InstallUsbipBackend'
          )
          foreach ($token in $tokens) {
            if (($asciiView.Contains($token, [StringComparison]::Ordinal)) -or
                ($utf16View.Contains($token, [StringComparison]::Ordinal))) {
              throw "source-built runtime host contains forbidden provisioning token: $token"
            }
          }
          Write-Host 'Runtime contains only the source-built, non-provisioning HIDMaestro host.'

      # Exercise the compiled private-command boundary without downloading the
      # SDK or touching the Driver Store. The copy must run from Program Files
      # to cross the same protected-installation gate as the shipping helper.
      - name: Exercise HIDMaestro installer private dispatch without loading SDK
        shell: pwsh
        timeout-minutes: 2
        run: |
          $programFilesRoot = [IO.Path]::TrimEndingDirectorySeparator(
            [IO.Path]::GetFullPath($env:ProgramFiles))
          $probeRoot = Join-Path $programFilesRoot (
            'ksx-hidmaestro-installer-contract-' + [Guid]::NewGuid().ToString('N'))
          $resolvedProbe = [IO.Path]::GetFullPath($probeRoot)
          $programFilesPrefix = $programFilesRoot + [IO.Path]::DirectorySeparatorChar
          if (-not $resolvedProbe.StartsWith(
              $programFilesPrefix,
              [StringComparison]::OrdinalIgnoreCase)) {
            throw 'HIDMaestro dispatch probe escaped Program Files.'
          }

          try {
            New-Item -ItemType Directory -Path $resolvedProbe | Out-Null
            $attributes = [IO.File]::GetAttributes($resolvedProbe)
            if (($attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'HIDMaestro dispatch probe directory is a reparse point.'
            }
            $probeExe = Join-Path $resolvedProbe 'ksx-hidmaestro-driver-installer.exe'
            Copy-Item `
              -LiteralPath 'target/release/ksx-hidmaestro-driver-installer.exe' `
              -Destination $probeExe

            $worker = Start-Process `
              -FilePath $probeExe `
              -ArgumentList @('install-worker-v1', 'C:\not-a-ksx-staging-directory') `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
            if ($worker.ExitCode -ne 5) {
              throw "Invalid private worker path returned $($worker.ExitCode), expected 5."
            }

            $selfTest = Start-Process `
              -FilePath $probeExe `
              -ArgumentList @('self-test-v1') `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
            if ($selfTest.ExitCode -ne 0) {
              throw "Compiled HIDMaestro installer self-test returned $($selfTest.ExitCode)."
            }

            $unknown = Start-Process `
              -FilePath $probeExe `
              -ArgumentList @('unexpected-command') `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
            if ($unknown.ExitCode -ne 2) {
              throw "Unknown private command returned $($unknown.ExitCode), expected 2."
            }
          }
          finally {
            $cleanupTarget = [IO.Path]::GetFullPath($resolvedProbe)
            if (-not $cleanupTarget.StartsWith(
                $programFilesPrefix,
                [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Refusing unsafe HIDMaestro dispatch probe cleanup.'
            }
            if (Test-Path -LiteralPath $cleanupTarget) {
              $cleanupAttributes = [IO.File]::GetAttributes($cleanupTarget)
              if (($cleanupAttributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'Refusing reparse-point HIDMaestro dispatch probe cleanup.'
              }
              Remove-Item -LiteralPath $cleanupTarget -Recurse -Force
            }
          }

      # cabinet + studio is the shipping combination: the egui panel UI plus the
      # local web config server. The launcher is deliberately a separate package:
      # ksx.exe stays a console application for its development CLI, while the
      # customer shortcut gets a GUI-subsystem process that starts `ksx open`
      # with CREATE_NO_WINDOW.
      - name: Build release
        shell: pwsh
        run: |
          cargo build --release -p ksx-app --features cabinet,studio
          if ($LASTEXITCODE -ne 0) { throw 'ksx-app release build failed' }
          cargo build --release -p ksx-launcher
          if ($LASTEXITCODE -ne 0) { throw 'ksx-launcher release build failed' }
          cargo build --release -p ksx-winusb-helper
          if ($LASTEXITCODE -ne 0) { throw 'ksx-winusb-helper release build failed' }

      # The replaceable LGPL provider is built from the corresponding source in
      # this tree. Two isolated builds must agree byte-for-byte before the first
      # one is copied beside the helper. The elevated smoke runs only here, on a
      # disposable runner, and restores certificates/key containers in finally.
      # A CONTROL for the step below, whose `pnputil /add-driver` blocks here.
      #
      # Same verb, same tool, but a package Microsoft signed and Windows already
      # trusts. It separates the two explanations that the smoke alone cannot:
      # if this also blocks, a hosted runner cannot stage ANY driver package and
      # Driver Store acceptance belongs on hardware, not in CI; if this returns
      # and only ours blocks, the package is the problem and the smoke is right
      # to fail. Diagnostic only -- it never fails the build, because a control
      # that can break the build is a second thing to debug.
      - name: Control - can this runner stage any driver package at all?
        shell: pwsh
        timeout-minutes: 6
        run: |
          $pnputil = Join-Path $env:SystemRoot 'System32\pnputil.exe'
          $inf = Join-Path $env:SystemRoot 'INF\netloop.inf'
          if (-not (Test-Path -LiteralPath $inf)) {
            Write-Host "CONTROL: inconclusive, no inbox INF at $inf"
            exit 0
          }
          $out = Join-Path $env:RUNNER_TEMP 'control-add.out'
          $err = Join-Path $env:RUNNER_TEMP 'control-add.err'
          $started = Get-Date
          $process = Start-Process -FilePath $pnputil `
            -ArgumentList @('/add-driver', ('"' + $inf + '"')) `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          if ($process.WaitForExit(240000)) {
            $elapsed = [int]((Get-Date) - $started).TotalSeconds
            Write-Host "CONTROL: inbox package returned exit $($process.ExitCode) in ${elapsed}s"
            Write-Host 'CONTROL: this runner CAN stage a driver package, so the block is ours.'
            Get-Content -LiteralPath $out -ErrorAction SilentlyContinue | Select-Object -First 10
          } else {
            Write-Host 'CONTROL: BLOCKED on a Microsoft-signed inbox package after 240s.'
            Write-Host 'CONTROL: the Driver Store is unusable on this runner -- environmental, not ours.'
            try { $process.Kill() } catch { }
          }

      - name: Build and verify prepare-only libwdi provider
        shell: pwsh
        # Two compiles plus the smoke are a few minutes; anything approaching
        # this ceiling is a block, not slow work. Without it a native call that
        # never returns holds the runner until the six-hour job default, which
        # is how one run sat for two hours with nothing to show for it. A step
        # that hangs must become a step that fails.
        timeout-minutes: 15
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($install)) {
            throw 'Pinned libwdi build requires Visual Studio 2022 Build Tools.'
          }
          $pinnedCl = Join-Path $install.Trim() 'VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\cl.exe'
          $pinnedSdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include\10.0.19041.0\um\Windows.h'
          if (-not (Test-Path -LiteralPath $pinnedCl -PathType Leaf)) {
            throw "Pinned MSVC 14.44.35207 x64 compiler is unavailable: $pinnedCl"
          }
          if (-not (Test-Path -LiteralPath $pinnedSdk -PathType Leaf)) {
            throw "Pinned Windows SDK 10.0.19041.0 is unavailable: $pinnedSdk"
          }
          Write-Host "Pinned provider toolchain: $pinnedCl; $pinnedSdk"

          $first = Join-Path $env:RUNNER_TEMP 'libwdi-build-a'
          $second = Join-Path $env:RUNNER_TEMP 'libwdi-build-b'
          ./third_party/libwdi/build.ps1 `
            -OutputDirectory $first `
            -PlatformToolset v143 `
            -VCToolsVersion 14.44.35207
          ./third_party/libwdi/build.ps1 `
            -OutputDirectory $second `
            -PlatformToolset v143 `
            -VCToolsVersion 14.44.35207
          $firstDll = Join-Path $first 'libwdi.dll'
          $secondDll = Join-Path $second 'libwdi.dll'
          $firstHash = (Get-FileHash -LiteralPath $firstDll -Algorithm SHA256).Hash
          $secondHash = (Get-FileHash -LiteralPath $secondDll -Algorithm SHA256).Hash
          if ($firstHash -cne $secondHash) {
            throw "libwdi reproducibility failure: $firstHash != $secondHash"
          }
          ./third_party/libwdi/test-provider.ps1 -DllPath $firstDll
          Copy-Item -LiteralPath $firstDll -Destination 'target/release/libwdi.dll'
          Write-Host "reproducible libwdi.dll SHA256 $firstHash"

      # The same boundary, driven through the code the product ships instead of
      # a PowerShell replica of it.  test-provider.ps1 above builds its own
      # `wdi_device_info`, its own options struct and its own path string, and
      # it was green for months while three defects sat in the Rust side of
      # exactly those three things -- a replica cannot fail the way the original
      # does.  This runs the real `WdiProvider::prepare` against the real DLL,
      # from a real canonicalized (`\?\`) directory, and asserts the artifacts.
      - name: Provider smoke through the shipped binding
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:KSX_WDI_SMOKE_DLL = (Resolve-Path 'target/release/libwdi.dll').Path
          cargo test -p ksx-platform --test wdi_provider -- --ignored --nocapture

      # Print the hash in the log so a downloaded artifact can be verified
      # against the run that produced it — and hand it up as a job output, so
      # the release body can carry the same number rather than a second one.
      - name: Hash
        id: exe
        shell: pwsh
        run: |
          $exe = 'target/release/ksx.exe'
          $launcher = 'target/release/ksx-launcher.exe'
          $helper = 'target/release/ksx-winusb-helper.exe'
          $hidmaestroHost = 'target/release/ksx-hidmaestro-host.exe'
          $hidmaestroInstaller = 'target/release/ksx-hidmaestro-driver-installer.exe'
          $provider = 'target/release/libwdi.dll'
          foreach ($required in @($exe, $launcher, $helper, $hidmaestroHost, $hidmaestroInstaller, $provider)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "required release binary was not built: $required"
            }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $dumpbin = Get-ChildItem -Path (Join-Path $install.Trim() 'VC\Tools\MSVC') `
            -Filter dumpbin.exe -Recurse |
            Where-Object FullName -Match '\\Hostx64\\x64\\dumpbin\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'x64 dumpbin.exe was not found' }
          $helperHeaders = (& $dumpbin.FullName /nologo /headers $helper | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              $helperHeaders -notmatch '(?im)^\s+8664 machine \(x64\)' -or
              $helperHeaders -notmatch '(?im)subsystem \(Windows GUI\)') {
            throw 'ksx-winusb-helper.exe must be an x64 Windows GUI-subsystem PE'
          }
          $hostHeaders = (& $dumpbin.FullName /nologo /headers $hidmaestroHost | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              $hostHeaders -notmatch '(?im)^\s+8664 machine \(x64\)' -or
              $hostHeaders -notmatch '(?im)subsystem \(Windows CUI\)') {
            throw 'ksx-hidmaestro-host.exe must be an x64 console-subsystem PE'
          }
          $installerHeaders = (& $dumpbin.FullName /nologo /headers $hidmaestroInstaller | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              $installerHeaders -notmatch '(?im)^\s+8664 machine \(x64\)' -or
              $installerHeaders -notmatch '(?im)subsystem \(Windows CUI\)') {
            throw 'ksx-hidmaestro-driver-installer.exe must be an x64 console-subsystem PE'
          }
          $mt = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\10.0.19041.0\x64\mt.exe'
          if (-not (Test-Path -LiteralPath $mt -PathType Leaf)) {
            throw "pinned manifest tool was not found at $mt"
          }
          $manifest = Join-Path $env:RUNNER_TEMP 'ksx-winusb-helper.manifest'
          & $mt "-inputresource:$helper;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw 'ksx-winusb-helper.exe has no readable RT_MANIFEST resource #1'
          }
          $manifestText = Get-Content -LiteralPath $manifest -Raw
          if ($manifestText -notmatch 'requestedExecutionLevel\s+level="requireAdministrator"') {
            throw 'ksx-winusb-helper.exe manifest must request requireAdministrator'
          }

          $h = (Get-FileHash $exe -Algorithm SHA256).Hash
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          $launcherHash = (Get-FileHash $launcher -Algorithm SHA256).Hash
          $launcherKb = [math]::Round((Get-Item $launcher).Length / 1KB, 1)
          $helperHash = (Get-FileHash $helper -Algorithm SHA256).Hash
          $hidmaestroHostHash = (Get-FileHash $hidmaestroHost -Algorithm SHA256).Hash
          $hidmaestroInstallerHash = (Get-FileHash $hidmaestroInstaller -Algorithm SHA256).Hash
          $providerHash = (Get-FileHash $provider -Algorithm SHA256).Hash
          Write-Host "ksx.exe  $mb MB"
          Write-Host "SHA256   $h"
          Write-Host "ksx-launcher.exe  $launcherKb KB"
          Write-Host "SHA256            $launcherHash"
          Write-Host "ksx-winusb-helper.exe SHA256 $helperHash"
          Write-Host "ksx-hidmaestro-host.exe SHA256 $hidmaestroHostHash"
          Write-Host "ksx-hidmaestro-driver-installer.exe SHA256 $hidmaestroInstallerHash"
          Write-Host "libwdi.dll SHA256               $providerHash"
          "sha256=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "### ksx executables`n`n- ksx.exe: $mb MB, SHA256 ``$h```n- ksx-launcher.exe: $launcherKb KB, SHA256 ``$launcherHash```n- ksx-winusb-helper.exe: SHA256 ``$helperHash```n- ksx-hidmaestro-host.exe: SHA256 ``$hidmaestroHostHash```n- ksx-hidmaestro-driver-installer.exe: SHA256 ``$hidmaestroInstallerHash```n- libwdi.dll: SHA256 ``$providerHash```n- commit: ``$env:GITHUB_SHA``" |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # The secondary release download is a PORTABLE DISTRIBUTION, not a bare
      # executable severed from its license notices. It intentionally omits the
      # ViGEmBus setup: `ksx install-drivers` refuses to elevate a payload from
      # a user-writable extraction directory, so including it here would promise
      # a path that the program correctly rejects. The full installer remains
      # the supported first-run path. The same boundary omits the elevated
      # WinUSB helper, libwdi.dll, and its corresponding source together:
      # portable is for already-prepared or Interception-capable advanced use.
      # It also omits the elevated HIDMaestro host and installer bootstrap:
      # those are installed-only protected siblings, not portable executables.
      - name: Package portable distribution with license material
        id: portable
        shell: pwsh
        run: |
          $cargo = Get-Content 'Cargo.toml' -Raw
          if ($cargo -notmatch '(?s)\[workspace\.package\][^\[]*?version\s*=\s*"([^"]+)"') {
            throw 'Cargo.toml has no [workspace.package] version.'
          }
          $name = "ksx-$($Matches[1])-windows-x86_64-portable.zip"
          $root = Join-Path $env:RUNNER_TEMP 'ksx-portable'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $files = @(
            'target/release/ksx.exe'
            'target/release/ksx-launcher.exe'
            'README.md'
            'NOTICE'
            'LICENSE-MIT'
            'LICENSE-APACHE'
          )
          Copy-Item $files -Destination $root
          Copy-Item 'THIRD-PARTY-LICENSES' -Destination $root -Recurse
          New-Item -ItemType Directory -Path 'packaging/out' -Force | Out-Null
          $zip = Join-Path 'packaging/out' $name
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash
          "name=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "sha256=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "$name  SHA256 $h"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ksx-windows-portable
          path: packaging/out/*-portable.zip
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      # A bare ksx.exe is not something a person can use. `packaging/ksx.iss`
      # describes the whole install — the console-free launcher, the single
      # customer Start-menu entry, the desktop icon, the bundled ViGEmBus
      # driver folder, and an uninstaller.
      #
      # Inno Setup ships preinstalled on windows-2022 — this job's image, not
      # `windows-latest`, which the comment used to name and which has meant
      # Windows Server 2025 since September 2025. So this needs no new
      # dependency. ISCC is not on PATH, hence the explicit path, and the
      # `Test-Path` below is what turns "the image dropped it" into a named
      # failure instead of a confusing ISCC-not-found stack.
      - name: Build installer
        id: installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc /Qp 'packaging\ksx.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          # OutputDir=out in ksx.iss, and it is relative to the .iss file.
          $setup = Get-ChildItem packaging\out\*setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'ISCC reported success but produced no setup.exe' }
          # The second half of the version agreement, and the half that checks
          # the ARTIFACT rather than the source: OutputBaseFilename is
          # `{#AppName}-{#AppVersion}-setup`, so this is the tag's version
          # appearing in the name of the file a customer will download.
          if ($env:RELEASE_TAG) {
            $expected = 'ksx-' + ($env:RELEASE_TAG -replace '^v', '') + '-setup.exe'
            if ($setup.Name -ne $expected) {
              throw "the installer is named $($setup.Name), but tag $env:RELEASE_TAG expects $expected"
            }
          }
          $h = (Get-FileHash $setup -Algorithm SHA256).Hash
          $mb = [math]::Round($setup.Length / 1MB, 2)
          Write-Host "$($setup.Name)  $mb MB"
          Write-Host "SHA256   $h"
          "name=$($setup.Name)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "sha256=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "### $($setup.Name)`n`n- size: $mb MB`n- SHA256: ``$h```n" |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # ProgramData grants ordinary users create rights.  A hostile local user
      # can therefore pre-place the product root as a junction before setup is
      # elevated.  The installer-only fixed helper must reject that object
      # before changing an owner/DACL or creating any child.  This runs only on
      # Microsoft's disposable release runner: it never probes a developer's
      # machine and it never removes an existing ProgramData object.
      - name: Reject hostile ProgramData junction without touching its target
        shell: pwsh
        timeout-minutes: 3
        run: |
          $link = 'C:\ProgramData\KSX'
          if (Get-Item -LiteralPath $link -Force -ErrorAction SilentlyContinue) {
            throw "$link already exists; refusing to replace or delete it"
          }

          # THE CONTROL, before anything hostile exists.  Without it every
          # assertion below is satisfied by an auditor that refuses its own
          # name: "exits nonzero" was true of every input while the install
          # died at step one, and that is exactly how three defects reached a
          # customer through a green pipeline.  This one step is the difference
          # between "refuses a junction" and "refuses".
          $cleanJson = Join-Path $env:RUNNER_TEMP 'ksx-checkstore-clean.json'
          $clean = Start-Process -FilePath 'target\release\ksx-winusb-helper.exe' `
            -ArgumentList 'check-store' -Wait -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $cleanJson
          $cleanOut = Get-Content -LiteralPath $cleanJson -Raw
          Write-Host "DIAG: helper check-store exit, nothing present = $($clean.ExitCode)"
          Write-Host "DIAG: helper check-store said = $cleanOut"
          if ($clean.ExitCode -ne 0) {
            throw ("check-store refused a machine with no C:\ProgramData\KSX at all " +
                   "(exit $($clean.ExitCode)). Every refusal assertion below would pass " +
                   "for the wrong reason: $cleanOut")
          }

          $target = Join-Path $env:RUNNER_TEMP 'ksx-hostile-junction-target'
          # PrepareToInstall refuses every custom executable directory before
          # it launches an elevated helper. Use the one shipping destination
          # here so this test reaches the WinUSB audit it is meant to prove.
          $install = Join-Path $env:ProgramFiles 'ksx'
          if (Test-Path -LiteralPath $install) {
            throw "$install exists before this clean-runner smoke; refusing to touch it"
          }
          New-Item -ItemType Directory -Path $target -ErrorAction Stop | Out-Null
          $marker = Join-Path $target 'do-not-touch.txt'
          Set-Content -LiteralPath $marker -Value 'hostile junction target' -NoNewline
          $targetAclBefore = (Get-Acl -LiteralPath $target).Sddl
          $markerAclBefore = (Get-Acl -LiteralPath $marker).Sddl
          $markerHashBefore = (Get-FileHash -LiteralPath $marker -Algorithm SHA256).Hash
          $setupFinished = $false

          try {
            New-Item -ItemType Junction -Path $link -Target $target -ErrorAction Stop | Out-Null
            $setup = Get-ChildItem 'packaging\out\*setup.exe' | Select-Object -First 1
            if (-not $setup) { throw 'installer smoke found no setup.exe' }
            # The helper, on its own, against the same hostile junction, before
            # Inno is involved at all. This one number separates "the helper
            # accepts a junction" from "the helper refuses and the installer
            # fails to act on it" -- which are opposite defects, and the reason
            # the previous run could not be acted on.
            $directJson = Join-Path $env:RUNNER_TEMP 'ksx-checkstore-junction.json'
            $directHelper = Start-Process -FilePath 'target\release\ksx-winusb-helper.exe' `
              -ArgumentList 'check-store' -Wait -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $directJson
            $directOut = Get-Content -LiteralPath $directJson -Raw
            Write-Host "DIAG: helper check-store exit, junction present = $($directHelper.ExitCode)"
            Write-Host "DIAG: helper check-store said = $directOut"
            if ($directHelper.ExitCode -eq 0) {
              throw 'check-store accepted a hostile C:\ProgramData\KSX junction'
            }
            # THE REASON, not just the refusal.  A refusal for an unrelated
            # cause -- a missing dependency, a bad argument, an unelevated
            # process -- must fail this job rather than be read as proof the
            # junction was caught.
            if ($directOut -notmatch 'reparse point') {
              throw ("check-store refused the junction for some other reason; " +
                     "nothing here proves it saw the junction at all: $directOut")
            }
            # One-or-more backslashes: the helper prints JSON, so the path
            # arrives escaped as C:\\ProgramData\\KSX.  Matching the literal
            # single-backslash form failed this step on its first run -- which
            # is the check working, just not on the defect it was aimed at.
            if ($directOut -notmatch 'ProgramData\\+KSX') {
              throw "check-store did not name the path it refused: $directOut"
            }
            Write-Host ("DIAG: junction target child count after direct auditor = " +
              @(Get-ChildItem -LiteralPath $target -Force -ErrorAction SilentlyContinue).Count)

            # Inno's own log, because this step's assertions can only say THAT
            # the installer did the wrong thing, never which line did it. The
            # store initializer runs in CurStepChanged and its exit code is
            # recorded here and nowhere else.
            $setupLog = Join-Path $env:RUNNER_TEMP 'ksx-junction-setup.log'
            $arguments = @(
              '/VERYSILENT'
              '/SUPPRESSMSGBOXES'
              '/NORESTART'
              '/MERGETASKS=!vigembus,!hidmaestro,!desktopicon'
              "/LOG=$setupLog"
            )
            $process = Start-Process -FilePath $setup.FullName -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(120000)) {
              throw 'installer did not reject the hostile junction within two minutes; process was left running'
            }
            $setupFinished = $true

            # Everything known, before anything is asserted. A bare "it accepted
            # the junction" sent the last investigation looking in the wrong
            # place; the state and the log say which.
            Write-Host "DIAG: setup exit code = $($process.ExitCode)"
            Write-Host "DIAG: ksx.exe installed = $(Test-Path -LiteralPath (Join-Path $install 'ksx.exe'))"
            $linkNow = Get-Item -LiteralPath $link -Force -ErrorAction SilentlyContinue
            Write-Host ("DIAG: C:\ProgramData\KSX still a reparse point = " +
              [bool]($linkNow -and ($linkNow.Attributes -band [IO.FileAttributes]::ReparsePoint)))
            Write-Host ("DIAG: junction target child count = " +
              @(Get-ChildItem -LiteralPath $target -Force -ErrorAction SilentlyContinue).Count)
            if (Test-Path -LiteralPath $setupLog) {
              # Unfiltered tail. The filtered version came back empty, which was
              # itself a fact, but an absence cannot say whether the initializer
              # ran and said nothing or never ran at all.
              Write-Host '--- setup log, last 40 lines ---'
              Get-Content -LiteralPath $setupLog -Tail 40 | ForEach-Object { Write-Host $_ }
              Write-Host '--- end setup log ---'
            } else {
              Write-Host "DIAG: no setup log at $setupLog"
            }

            if ($process.ExitCode -eq 0) {
              throw 'installer accepted a hostile C:\ProgramData\KSX junction'
            }
            # Same rule one layer up.  The installer aborting is not evidence
            # unless it aborted for THIS: PrepareToInstall's refusal is written
            # to the Inno log verbatim, and any other abort means the audit
            # never ran.
            if (-not (Test-Path -LiteralPath $setupLog)) {
              throw 'no setup log, so nothing proves WHY the installer aborted'
            }
            $logText = Get-Content -LiteralPath $setupLog -Raw
            if ($logText -notmatch 'WinUSB recovery directory') {
              throw ('the installer aborted, but not on the WinUSB recovery audit; ' +
                     'this assertion would pass for any broken installer')
            }

            $linkItem = Get-Item -LiteralPath $link -Force -ErrorAction Stop
            if (($linkItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
              throw 'installer replaced the hostile junction instead of rejecting it'
            }
            if ((Get-Acl -LiteralPath $target).Sddl -cne $targetAclBefore) {
              throw 'installer changed the hostile junction target directory ACL'
            }
            if ((Get-Acl -LiteralPath $marker).Sddl -cne $markerAclBefore) {
              throw 'installer changed the hostile junction target marker ACL'
            }
            if ((Get-FileHash -LiteralPath $marker -Algorithm SHA256).Hash -cne $markerHashBefore) {
              throw 'installer changed the hostile junction target marker bytes'
            }
            $unexpected = Get-ChildItem -LiteralPath $target -Force |
              Where-Object Name -ne 'do-not-touch.txt'
            if ($unexpected) {
              throw "installer created content through the hostile junction: $($unexpected.Name -join ', ')"
            }
            if (Test-Path -LiteralPath (Join-Path $install 'ksx.exe')) {
              throw 'installer copied product files after the pre-install audit refusal'
            }
          }
          finally {
            # Never detach the test junction while setup might still be using
            # it.  A timed-out process is left for disposal with the runner.
            if ($setupFinished) {
              $item = Get-Item -LiteralPath $link -Force -ErrorAction SilentlyContinue
              if ($item -and (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) {
                Remove-Item -LiteralPath $link -Force
              }
              if (-not (Test-Path -LiteralPath $target) -or
                  -not (Test-Path -LiteralPath $marker)) {
                throw 'removing the test junction also removed its target'
              }
              # The path was proven absent above and is this workflow's exact
              # default Program Files target. Remove only setup residue so the
              # full install/uninstall/upgrade lifecycle below starts clean.
              if (Test-Path -LiteralPath $install) {
                $expectedInstall = [IO.Path]::GetFullPath(
                  (Join-Path $env:ProgramFiles 'ksx'))
                $actualInstall = [IO.Path]::GetFullPath($install)
                if ($actualInstall -cne $expectedInstall) {
                  throw "refusing to clean unexpected install path $actualInstall"
                }
                Remove-Item -LiteralPath $actualInstall -Recurse -Force
              }
            }
          }

      # The upgrade path: a SECOND install on a machine that has already
      # prepared a keyboard.
      #
      # Every branch of `initialize-store` that runs only for an EXISTING
      # store was unreachable here -- a runner is a fresh machine, so the
      # store never exists -- and reachable on every customer machine that
      # had once prepared a keyboard. One of them was wrong: the per-receipt
      # path check compared a canonicalized receipt path against a
      # non-canonicalized one and judged every receipt to have escaped its
      # own transaction directory. Every upgrade died on it; nothing in CI
      # could see it.
      #
      # ksx creates the store itself rather than this step hand-building
      # one, because the store must be owned by
      # SYSTEM/Administrators/TrustedInstaller and a directory this step
      # creates is owned by the runner -- which would reproduce exit 3 for a
      # reason unrelated to the defect. Install once, seed, install again.
      - name: Install twice, with a receipt in between
        shell: pwsh
        timeout-minutes: 8
        run: |
          $root = 'C:\ProgramData\KSX'
          if (Test-Path -LiteralPath $root) {
            throw "$root exists before this step; refusing to touch it"
          }
          $setup = Get-ChildItem 'packaging\out\*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no setup.exe to install' }
          # The shipping installer deliberately refuses custom executable
          # locations before launching elevated helpers. Exercise that exact
          # customer contract, including the space in Program Files.
          $install = Join-Path $env:ProgramFiles 'ksx'
          if (Test-Path -LiteralPath $install) {
            throw "$install exists before this clean-runner lifecycle; refusing to touch it"
          }
          $daemon = $null
          $lifecycleCompleted = $false

          function Invoke-Setup([string] $Tag) {
            $log = Join-Path $env:RUNNER_TEMP "ksx-upgrade-$Tag.log"
            # QUOTED. Program Files has a space in it, and an unquoted
            # /DIR= made Inno install to C:\Program -- which is not a
            # protected directory, so the store initializer refused and the
            # step reported a product failure that was entirely its own.
            $a = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
                   '/MERGETASKS=!vigembus,!hidmaestro,!desktopicon',
                   "/DIR=""$install""", "/LOG=""$log""")
            $p = Start-Process -FilePath $setup.FullName -ArgumentList $a -Wait -PassThru
            $text = if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Raw } else { '' }
            Write-Host "DIAG: install $Tag exit = $($p.ExitCode)"
            # Exit 0 is not the assertion. The store initializer raises from
            # CurStepChanged, which Inno reports and then carries on from, so
            # a broken upgrade still exits 0 with a dialog the customer has
            # to interpret. The log is the only place it is recorded.
            if ($p.ExitCode -ne 0 -or $text -match 'initializer exit code') {
              Write-Host "--- setup log ($Tag) ---"
              Write-Host $text
              throw "install $Tag did not complete cleanly (exit $($p.ExitCode))"
            }
            # Where it landed, checked -- because an argument Inno silently
            # truncates produces a working install of the wrong thing in the
            # wrong place, and every assertion after it is then about a
            # directory nobody meant.
            if (-not (Test-Path -LiteralPath (Join-Path $install 'ksx.exe'))) {
              throw "install $Tag did not put ksx.exe in $install"
            }
          }

          try {
            # 1. First install. ksx creates the store, correctly owned.
            Invoke-Setup 'first'

            # 1a. Boot the INSTALLED product, not target/release. A successful
            # setup exit and the presence of ksx.exe prove only that bytes were
            # copied. This is the release-cycle handoff users actually need:
            # the packaged binary binds the production port, declares the live
            # machine provider, and serves the redesign workbench from its
            # embedded assets.
            $studio = $null
            $studioOut = Join-Path $env:RUNNER_TEMP 'ksx-installed-studio.out.log'
            $studioErr = Join-Path $env:RUNNER_TEMP 'ksx-installed-studio.err.log'
            try {
              $studio = Start-Process -FilePath (Join-Path $install 'ksx.exe') `
                -ArgumentList @('studio', '--port', '4460') `
                -WorkingDirectory $install -PassThru -WindowStyle Hidden `
                -RedirectStandardOutput $studioOut `
                -RedirectStandardError $studioErr
              $deadline = [DateTime]::UtcNow.AddSeconds(90)
              $healthResponse = $null
              while ([DateTime]::UtcNow -lt $deadline) {
                if ($studio.HasExited) {
                  $out = if (Test-Path -LiteralPath $studioOut) { Get-Content -LiteralPath $studioOut -Raw } else { '' }
                  $err = if (Test-Path -LiteralPath $studioErr) { Get-Content -LiteralPath $studioErr -Raw } else { '' }
                  throw "installed ksx studio exited $($studio.ExitCode) before health answered`nstdout:`n$out`nstderr:`n$err"
                }
                try {
                  $healthResponse = Invoke-WebRequest -UseBasicParsing `
                    -Uri 'http://127.0.0.1:4460/api/health' -TimeoutSec 2
                  if ($healthResponse.StatusCode -eq 200) { break }
                }
                catch {
                  Start-Sleep -Milliseconds 250
                }
              }
              if (-not $healthResponse -or $healthResponse.StatusCode -ne 200) {
                throw 'installed ksx studio did not answer /api/health on port 4460 within 90 seconds'
              }
              if ([string]$healthResponse.Headers['Cache-Control'] -notmatch 'no-store') {
                throw 'installed /api/health lost its no-store contract'
              }
              try {
                $health = $healthResponse.Content | ConvertFrom-Json
              }
              catch {
                throw "installed /api/health did not return valid JSON: $_"
              }
              if ([string]$health.environment.id -cne 'live-machine' -or
                  [bool]$health.environment.fixture) {
                throw 'installed Studio did not declare the live-machine provider'
              }

              $product = Invoke-WebRequest -UseBasicParsing `
                -Uri 'http://127.0.0.1:4460/redesign' -TimeoutSec 15
              if ($product.StatusCode -ne 200 -or
                  [string]$product.Headers['Content-Type'] -notmatch '^text/html' -or
                  $product.Content -notmatch 'data-forma-island') {
                throw 'installed Studio did not serve the embedded /redesign product document'
              }

              # The shell marker alone can stay green while the hashed client
              # graph is absent. Fetch every referenced immutable Studio asset
              # from this installed binary and require both script and style.
              $assetPaths = @(
                [regex]::Matches(
                  $product.Content,
                  '(?i)(?:src|href)=["''](?<path>/_assets/[^"'']+)["'']'
                ) | ForEach-Object { $_.Groups['path'].Value } | Sort-Object -Unique
              )
              if ($assetPaths.Count -lt 2 -or
                  -not ($assetPaths -match '\.js(?:\?|$)') -or
                  -not ($assetPaths -match '\.css(?:\?|$)')) {
                throw 'installed /redesign did not reference both hashed JavaScript and CSS assets'
              }
              foreach ($assetPath in $assetPaths) {
                $assetUri = [Uri]::new(
                  [Uri]'http://127.0.0.1:4460/',
                  $assetPath
                ).AbsoluteUri
                $asset = Invoke-WebRequest -UseBasicParsing -Uri $assetUri -TimeoutSec 15
                if ($asset.StatusCode -ne 200 -or $asset.Content.Length -eq 0) {
                  throw "installed Studio asset did not load: $assetPath"
                }
              }
              Write-Host "installed runtime smoke: live /api/health, /redesign, and $($assetPaths.Count) hashed assets are serving on port 4460"
            }
            finally {
              if ($studio -and -not $studio.HasExited) {
                Stop-Process -Id $studio.Id -Force
                Wait-Process -Id $studio.Id -ErrorAction SilentlyContinue
              }
            }

            # Start the installed daemon with an open stdin handle and prove its
            # control pipe answers before uninstall. The uninstaller must drive
            # this live process to a clean exit through `uninstall-quiesce`.
            $daemonInfo = [Diagnostics.ProcessStartInfo]::new()
            $daemonInfo.FileName = Join-Path $install 'ksx.exe'
            $daemonInfo.WorkingDirectory = $install
            $daemonInfo.Arguments = 'daemon --headless --console'
            $daemonInfo.UseShellExecute = $false
            $daemonInfo.CreateNoWindow = $true
            $daemonInfo.RedirectStandardInput = $true
            $daemonInfo.RedirectStandardOutput = $true
            $daemonInfo.RedirectStandardError = $true
            $daemonProcess = [Diagnostics.Process]::new()
            $daemonProcess.StartInfo = $daemonInfo
            if (-not $daemonProcess.Start()) {
              throw 'installed daemon process did not start'
            }
            $daemon = $daemonProcess
            $daemonReady = $false
            $daemonDeadline = [DateTime]::UtcNow.AddSeconds(30)
            while ([DateTime]::UtcNow -lt $daemonDeadline) {
              if ($daemon.HasExited) { break }
              $statusText = & (Join-Path $install 'ksx.exe') session status --json 2>$null
              if ($LASTEXITCODE -eq 0) {
                try {
                  $status = $statusText | ConvertFrom-Json
                  if ([bool]$status.ok) {
                    $daemonReady = $true
                    break
                  }
                }
                catch {}
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $daemonReady) {
              try { $daemon.StandardInput.Close() } catch {}
              if (-not $daemon.WaitForExit(5000)) {
                Stop-Process -Id $daemon.Id -Force
                $daemon.WaitForExit()
              }
              $daemonOut = $daemon.StandardOutput.ReadToEnd()
              $daemonErr = $daemon.StandardError.ReadToEnd()
              throw "installed daemon did not expose a live control pipe`nstdout:`n$daemonOut`nstderr:`n$daemonErr"
            }

            # 1b. Exercise the real Inno uninstaller while the recovery store
            # is clean and the daemon is live. Inno emits explicit gate
            # sentinels only after `uninstall-quiesce` and `cleanup-owned`
            # succeed; directory deletion alone cannot make this test pass.
            # Reinstall afterwards so the existing-receipt upgrade scenario
            # below remains independent.
            $uninstallers = @(Get-ChildItem -LiteralPath $install -Filter 'unins*.exe' -File)
            if ($uninstallers.Count -ne 1) {
              throw "expected one installed Inno uninstaller, found $($uninstallers.Count)"
            }
            $uninstallLog = Join-Path $env:RUNNER_TEMP 'ksx-clean-uninstall.log'
            $uninstallArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
                               "/LOG=`"$uninstallLog`"")
            $uninstall = Start-Process -FilePath $uninstallers[0].FullName `
              -ArgumentList $uninstallArgs -Wait -PassThru -WindowStyle Hidden
            $uninstallText = if (Test-Path -LiteralPath $uninstallLog) {
              Get-Content -LiteralPath $uninstallLog -Raw
            } else { '' }
            if ($uninstall.ExitCode -ne 0) {
              throw "clean uninstall exited $($uninstall.ExitCode)`n$uninstallText"
            }
            foreach ($sentinel in @(
              'KSX uninstall gate: session quiesced',
              'KSX uninstall gate: owned recovery released'
            )) {
              if ($uninstallText -notmatch [regex]::Escape($sentinel)) {
                throw "clean uninstall log did not prove '$sentinel'`n$uninstallText"
              }
            }
            if (-not $daemon.WaitForExit(30000)) {
              throw 'clean uninstall did not stop the live installed daemon within 30 seconds'
            }
            $daemonOut = $daemon.StandardOutput.ReadToEnd()
            $daemonErr = $daemon.StandardError.ReadToEnd()
            if ($daemon.ExitCode -ne 0) {
              throw "installed daemon exited $($daemon.ExitCode) during uninstall`nstdout:`n$daemonOut`nstderr:`n$daemonErr"
            }
            $uninstallDeadline = [DateTime]::UtcNow.AddSeconds(30)
            while ([DateTime]::UtcNow -lt $uninstallDeadline -and
                   ((Test-Path -LiteralPath $install) -or (Test-Path -LiteralPath $root))) {
              Start-Sleep -Milliseconds 250
            }
            if (Test-Path -LiteralPath $install) {
              throw "clean uninstall left its Program Files directory: $install"
            }
            if (Test-Path -LiteralPath $root) {
              throw "clean uninstall left its empty ProgramData root: $root"
            }
            Write-Host 'clean uninstall: quiesced, released owned recovery state, and removed installed files'

            Invoke-Setup 'after-uninstall'

            $journal = Join-Path $root 'WinUSB\journal'
            $txRoot = Join-Path $root 'WinUSB\transactions'
            if (-not (Test-Path -LiteralPath $journal)) {
              throw 'the first install did not create the recovery store'
            }

            # 2. A receipt, shaped exactly as a prepare writes one -- above
            #    all with the VERBATIM artifact paths that
            #    ProgramDataStore::open really records.
            $id = '0a468347dd47c74246cebd18d3830285'
            $tx = Join-Path $txRoot $id
            New-Item -ItemType Directory -Path $tx -Force | Out-Null
            $inf = "ksx-winusb-$id.inf"
            $cat = "ksx-winusb-$id.cat"
            Set-Content -LiteralPath (Join-Path $tx $inf) -Value '; synthetic' -NoNewline
            Set-Content -LiteralPath (Join-Path $tx $cat) -Value 'synthetic' -NoNewline
            $verbatim = '\\?\' + $tx   # literal: PowerShell does not collapse these
            $device = 'USB\VID_D209&PID_0430&MI_00\7&CI&0&0000'
            $receipt = [ordered]@{
              schema = 1
              phase = 'released'
              transaction_id = $id
              target_instance_id = $device
              hardware_id = 'USB\VID_D209&PID_0430&MI_00'
              original_service = 'HidUsb'
              original_inf = $null
              original_inf_name = $inf
              published_oem_inf = $null
              inf_path = (Join-Path $verbatim $inf)
              catalog_path = (Join-Path $verbatim $cat)
              inf_sha256 = $null
              catalog_sha256 = $null
              certificate_subject = "CN=KSX WinUSB $id"
              certificate_thumbprint_sha1 = $null
              certificate_der_sha256 = $null
              affected_instance_ids = @($device)
              keyboards_before = 2
              created_unix_seconds = 0
              recovery_reason = $null
              driver_mutation_attempted = $false
              reboot_reported = $false
            }
            $receipt | ConvertTo-Json -Depth 5 |
              Set-Content -LiteralPath (Join-Path $journal "$id.json") -Encoding utf8

            # 3. Ask the INSTALLED helper directly first, with its stdout
            #    captured. Setup launches it through ShellExecuteEx for the UAC
            #    prompt, which cannot redirect stdout, so the one sentence
            #    naming any refusal is discarded -- and "initializer exit code
            #    3" with no message has now cost several rounds of guessing.
            #    After install #1 the helper is in Program Files, so it passes
            #    its own protected-directory rule and this is a fair question.
            $probe = Join-Path $env:RUNNER_TEMP 'ksx-init-probe.json'
            $ph = Start-Process -FilePath (Join-Path $install 'ksx-winusb-helper.exe') `
              -ArgumentList 'initialize-store' -Wait -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $probe
            $said = Get-Content -LiteralPath $probe -Raw
            Write-Host "DIAG: initialize-store over a seeded receipt exit = $($ph.ExitCode)"
            Write-Host "DIAG: said = $said"
            if ($ph.ExitCode -ne 0) {
              throw ("initialize-store refused a store holding an ordinary receipt " +
                     "(exit $($ph.ExitCode)): $said")
            }

            # 4. Seed the one retired v0.4.x runtime filename. Inno keeps
            #    unlisted files across upgrades unless [InstallDelete] names
            #    them exactly; a clean install alone cannot prove this
            #    distribution boundary.
            $legacySdkHost = Join-Path $install 'ksx-hidmaestro-sdk-host.exe'
            Set-Content -LiteralPath $legacySdkHost -Value 'retired-sdk-host-sentinel' -NoNewline

            # 5. The upgrade. This is the install every customer hit.
            Invoke-Setup 'second'
            if (Test-Path -LiteralPath $legacySdkHost) {
              throw 'the upgrade retained the retired SDK-backed HIDMaestro runtime host'
            }
            if (-not (Test-Path -LiteralPath (Join-Path $journal "$id.json"))) {
              throw 'the upgrade removed a receipt it was only asked to verify'
            }
            Write-Host "upgrade over an existing receipt: clean"

            # Leave a genuinely clean machine boundary for the artifact-store
            # proof below. Deleting only Program Files would leave Inno's
            # same-AppId registry and Start-menu state behind, silently turning
            # the downloaded setup into another upgrade instead of a clean
            # install. This must be the product's real uninstaller too.
            $upgradeUninstallers = @(
              Get-ChildItem -LiteralPath $install -Filter 'unins*.exe' -File
            )
            if ($upgradeUninstallers.Count -ne 1) {
              throw "expected one post-upgrade uninstaller, found $($upgradeUninstallers.Count)"
            }
            $upgradeUninstallLog = Join-Path $env:RUNNER_TEMP 'ksx-upgrade-uninstall.log'
            $upgradeUninstallArgs = @(
              '/VERYSILENT'
              '/SUPPRESSMSGBOXES'
              '/NORESTART'
              "/LOG=`"$upgradeUninstallLog`""
            )
            $upgradeUninstall = Start-Process `
              -FilePath $upgradeUninstallers[0].FullName `
              -ArgumentList $upgradeUninstallArgs -Wait -PassThru -WindowStyle Hidden
            $upgradeUninstallText = if (Test-Path -LiteralPath $upgradeUninstallLog) {
              Get-Content -LiteralPath $upgradeUninstallLog -Raw
            } else { '' }
            if ($upgradeUninstall.ExitCode -ne 0) {
              throw ("post-upgrade uninstall exited $($upgradeUninstall.ExitCode)" +
                     "`n$upgradeUninstallText")
            }
            foreach ($sentinel in @(
              'KSX uninstall gate: session quiesced',
              'KSX uninstall gate: owned recovery released'
            )) {
              if ($upgradeUninstallText -notmatch [regex]::Escape($sentinel)) {
                throw "post-upgrade uninstall did not prove '$sentinel'`n$upgradeUninstallText"
              }
            }

            $uninstallKey = ('Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\' +
              'Windows\CurrentVersion\Uninstall\' +
              '{7B2F5A46-3C1D-4E9A-9F30-2A6C0E8D4B11}_is1')
            $startMenuGroup = Join-Path $env:ProgramData `
              'Microsoft\Windows\Start Menu\Programs\ksx'
            $upgradeUninstallDeadline = [DateTime]::UtcNow.AddSeconds(30)
            while ([DateTime]::UtcNow -lt $upgradeUninstallDeadline -and
                   ((Test-Path -LiteralPath $install) -or
                    (Test-Path -LiteralPath $root) -or
                    (Test-Path -LiteralPath $uninstallKey) -or
                    (Test-Path -LiteralPath $startMenuGroup))) {
              Start-Sleep -Milliseconds 250
            }
            foreach ($residue in @($install, $root, $uninstallKey, $startMenuGroup)) {
              if (Test-Path -LiteralPath $residue) {
                throw "post-upgrade real uninstall left residue: $residue"
              }
            }
            $lifecycleCompleted = $true
            Write-Host 'post-upgrade real uninstall left clean filesystem, registry, and shortcut state'
          }
          finally {
            if ($daemon -and -not $daemon.HasExited) {
              try { $daemon.StandardInput.Close() } catch {}
              if (-not $daemon.WaitForExit(5000)) {
                Stop-Process -Id $daemon.Id -Force
                $daemon.WaitForExit()
              }
            }
            if ($daemon) { $daemon.Dispose() }
            # Failure hygiene on this disposable runner only. A successful
            # lifecycle reaches the real-uninstaller assertions above and must
            # not be made green by manual deletion here.
            if (-not $lifecycleCompleted) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $install -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      # One machine-readable identity for the candidate a person installs.
      # Branch and tag builds can have the same source commit and still produce
      # different container bytes, so QA and publication bind to these files,
      # this run, and this hash rather than to "the same recipe".
      - name: Write exact-candidate manifest
        id: candidate_manifest
        shell: pwsh
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          CANDIDATE_REF: ${{ github.ref }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SETUP_NAME: ${{ steps.installer.outputs.name }}
          SETUP_SHA256: ${{ steps.installer.outputs.sha256 }}
          PORTABLE_NAME: ${{ steps.portable.outputs.name }}
          PORTABLE_SHA256: ${{ steps.portable.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cargo = Get-Content -LiteralPath 'Cargo.toml' -Raw
          if ($cargo -notmatch '(?s)\[workspace\.package\][^\[]*?version\s*=\s*"([^"]+)"') {
            throw 'Cargo.toml has no [workspace.package] version.'
          }
          $version = $Matches[1]
          $toolchainSpec = Get-Content -LiteralPath 'rust-toolchain.toml' -Raw
          if ($toolchainSpec -notmatch '(?m)^channel\s*=\s*"([^"]+)"') {
            throw 'rust-toolchain.toml has no pinned channel'
          }
          $toolchainChannel = $Matches[1]
          $activeToolchain = (& rustup show active-toolchain | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($activeToolchain)) {
            throw 'the active Rust toolchain could not be recorded'
          }

          $setup = Join-Path 'packaging/out' $env:SETUP_NAME
          $portable = Join-Path 'packaging/out' $env:PORTABLE_NAME
          foreach ($path in @($setup, $portable)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "candidate artifact is missing before manifest creation: $path"
            }
          }
          $setupItem = Get-Item -LiteralPath $setup
          $portableItem = Get-Item -LiteralPath $portable
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          $portableHash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash
          if ($setupHash -cne $env:SETUP_SHA256 -or
              $portableHash -cne $env:PORTABLE_SHA256) {
            throw 'candidate bytes changed after their build-step hashes were recorded'
          }

          $manifest = [ordered]@{
            schema = 1
            source = [ordered]@{
              repository = $env:CANDIDATE_REPOSITORY
              commit = $env:CANDIDATE_COMMIT
              ref = $env:CANDIDATE_REF
            }
            run = [ordered]@{
              id = $env:CANDIDATE_RUN_ID
              attempt = [int]$env:CANDIDATE_RUN_ATTEMPT
            }
            release = [ordered]@{
              tag = [string]$env:RELEASE_TAG
              version = $version
            }
            toolchain = [ordered]@{
              channel = $toolchainChannel
              active = $activeToolchain
            }
            artifacts = [ordered]@{
              installer = [ordered]@{
                filename = $setupItem.Name
                size = [long]$setupItem.Length
                sha256 = $setupHash
              }
              portable = [ordered]@{
                filename = $portableItem.Name
                size = [long]$portableItem.Length
                sha256 = $portableHash
              }
            }
          }
          $name = 'ksx-candidate-manifest.json'
          $path = Join-Path 'packaging/out' $name
          $manifest | ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath $path -Encoding utf8
          $manifestHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          "name=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "sha256=$manifestHash" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "$name SHA256 $manifestHash"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ksx-windows-installer
          path: packaging/out/*setup.exe
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ksx-windows-candidate-manifest
          path: packaging/out/ksx-candidate-manifest.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      # Upload success only proves that the artifact service accepted some
      # bytes. Pull each container back out of THIS run before the job can pass,
      # then install the returned setup.exe rather than its build-tree source.
      # Separate directories preserve the artifact-name boundary as well as the
      # candidate's three file identities.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ksx-windows-installer
          path: ${{ runner.temp }}\ksx-artifact-roundtrip\installer
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ksx-windows-portable
          path: ${{ runner.temp }}\ksx-artifact-roundtrip\portable
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ksx-windows-candidate-manifest
          path: ${{ runner.temp }}\ksx-artifact-roundtrip\manifest

      - name: Prove the downloaded candidate installs, boots, and uninstalls
        shell: pwsh
        timeout-minutes: 8
        env:
          DOWNLOAD_ROOT: ${{ runner.temp }}\ksx-artifact-roundtrip
          SETUP_NAME: ${{ steps.installer.outputs.name }}
          SETUP_SHA256: ${{ steps.installer.outputs.sha256 }}
          PORTABLE_NAME: ${{ steps.portable.outputs.name }}
          PORTABLE_SHA256: ${{ steps.portable.outputs.sha256 }}
          MANIFEST_NAME: ${{ steps.candidate_manifest.outputs.name }}
          MANIFEST_SHA256: ${{ steps.candidate_manifest.outputs.sha256 }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-OnlyDownloadedFile(
            [string] $Directory,
            [string] $ExpectedName
          ) {
            if ([string]::IsNullOrWhiteSpace($ExpectedName) -or
                [IO.Path]::GetFileName($ExpectedName) -cne $ExpectedName) {
              throw "unsafe or empty candidate filename: '$ExpectedName'"
            }
            if (-not (Test-Path -LiteralPath $Directory -PathType Container)) {
              throw "downloaded artifact directory is missing: $Directory"
            }
            $entries = @(Get-ChildItem -LiteralPath $Directory -Force)
            if ($entries.Count -ne 1 -or $entries[0].PSIsContainer) {
              throw ("downloaded artifact directory must contain exactly one file: " +
                     "$Directory ($($entries.Name -join ', '))")
            }
            if ($entries[0].Name -cne $ExpectedName) {
              throw "downloaded '$($entries[0].Name)' where '$ExpectedName' was declared"
            }
            return $entries[0]
          }

          foreach ($hash in @(
            $env:SETUP_SHA256,
            $env:PORTABLE_SHA256,
            $env:MANIFEST_SHA256
          )) {
            if ($hash -cnotmatch '^[A-F0-9]{64}$') {
              throw "build output is not an exact SHA-256: '$hash'"
            }
          }

          $setup = Get-OnlyDownloadedFile `
            (Join-Path $env:DOWNLOAD_ROOT 'installer') $env:SETUP_NAME
          $portable = Get-OnlyDownloadedFile `
            (Join-Path $env:DOWNLOAD_ROOT 'portable') $env:PORTABLE_NAME
          $manifestFile = Get-OnlyDownloadedFile `
            (Join-Path $env:DOWNLOAD_ROOT 'manifest') $env:MANIFEST_NAME

          $manifestHash = (Get-FileHash -LiteralPath $manifestFile.FullName `
            -Algorithm SHA256).Hash
          if ($manifestHash -cne $env:MANIFEST_SHA256) {
            throw ("downloaded manifest hashes $manifestHash but the build reported " +
                   $env:MANIFEST_SHA256)
          }
          try {
            $manifest = Get-Content -LiteralPath $manifestFile.FullName -Raw |
              ConvertFrom-Json
          }
          catch {
            throw "downloaded exact-candidate manifest is not valid JSON: $_"
          }

          $cargo = Get-Content -LiteralPath 'Cargo.toml' -Raw
          if ($cargo -notmatch '(?s)\[workspace\.package\][^\[]*?version\s*=\s*"([^"]+)"') {
            throw 'Cargo.toml has no [workspace.package] version'
          }
          $expectedVersion = $Matches[1]
          $toolchainSpec = Get-Content -LiteralPath 'rust-toolchain.toml' -Raw
          if ($toolchainSpec -notmatch '(?m)^channel\s*=\s*"([^"]+)"') {
            throw 'rust-toolchain.toml has no pinned channel'
          }
          $expectedToolchain = $Matches[1]
          $activeToolchain = (& rustup show active-toolchain | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace($activeToolchain)) {
            throw 'the active Rust toolchain could not be verified'
          }

          if ([int]$manifest.schema -ne 1 -or
              [string]$manifest.source.repository -cne $env:EXPECTED_REPOSITORY -or
              [string]$manifest.source.commit -cne $env:EXPECTED_COMMIT -or
              [string]$manifest.source.ref -cne $env:EXPECTED_REF -or
              [string]$manifest.run.id -cne $env:EXPECTED_RUN_ID -or
              [int]$manifest.run.attempt -ne [int]$env:EXPECTED_RUN_ATTEMPT -or
              [string]$manifest.release.tag -cne $env:EXPECTED_RELEASE_TAG -or
              [string]$manifest.release.version -cne $expectedVersion -or
              [string]$manifest.toolchain.channel -cne $expectedToolchain -or
              [string]$manifest.toolchain.active -cne $activeToolchain) {
            throw 'downloaded manifest does not identify this exact source, run, version, and toolchain'
          }
          if ($env:EXPECTED_RELEASE_TAG -and
              $env:EXPECTED_RELEASE_TAG -cne "v$expectedVersion") {
            throw 'the downloaded candidate release tag and source version disagree'
          }

          $setupHash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash
          $portableHash = (Get-FileHash -LiteralPath $portable.FullName -Algorithm SHA256).Hash
          if ($setupHash -cne $env:SETUP_SHA256 -or
              $portableHash -cne $env:PORTABLE_SHA256) {
            throw 'downloaded candidate hash disagrees with its build output'
          }
          if ([string]$manifest.artifacts.installer.filename -cne $setup.Name -or
              [long]$manifest.artifacts.installer.size -ne [long]$setup.Length -or
              [string]$manifest.artifacts.installer.sha256 -cne $setupHash -or
              [string]$manifest.artifacts.portable.filename -cne $portable.Name -or
              [long]$manifest.artifacts.portable.size -ne [long]$portable.Length -or
              [string]$manifest.artifacts.portable.sha256 -cne $portableHash) {
            throw 'downloaded filenames, sizes, or hashes disagree with the manifest'
          }
          Write-Host "artifact-store round trip verified $($setup.Name) SHA256 $setupHash"
          Write-Host "artifact-store round trip verified $($portable.Name) SHA256 $portableHash"
          Write-Host "artifact-store round trip verified $($manifestFile.Name) SHA256 $manifestHash"

          # The earlier lifecycle's real uninstaller proves these locations
          # absent. Recheck at the artifact boundary; accepting residue would
          # let this smoke boot or upgrade the preceding copy.
          $install = [IO.Path]::GetFullPath((Join-Path $env:ProgramFiles 'ksx'))
          $programData = [IO.Path]::GetFullPath('C:\ProgramData\KSX')
          $uninstallKey = ('Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\' +
            'Windows\CurrentVersion\Uninstall\' +
            '{7B2F5A46-3C1D-4E9A-9F30-2A6C0E8D4B11}_is1')
          $startMenuGroup = Join-Path $env:ProgramData `
            'Microsoft\Windows\Start Menu\Programs\ksx'
          foreach ($path in @(
            $install,
            $programData,
            $uninstallKey,
            $startMenuGroup
          )) {
            if (Test-Path -LiteralPath $path) {
              throw "artifact roundtrip requires a clean machine path: $path"
            }
          }
          if (Get-NetTCPConnection -LocalPort 4460 -State Listen `
              -ErrorAction SilentlyContinue) {
            throw 'port 4460 already has a listener before downloaded ksx starts'
          }

          $setupLog = Join-Path $env:RUNNER_TEMP 'ksx-roundtrip-setup.log'
          $disabledTasks = @('!vigembus', '!hidmaestro', '!desktopicon') -join ','
          $setupArgs = @(
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            "/MERGETASKS=$disabledTasks"
            "/DIR=`"$install`""
            "/LOG=`"$setupLog`""
          )
          $installer = Start-Process -FilePath $setup.FullName `
            -ArgumentList $setupArgs -Wait -PassThru -WindowStyle Hidden
          $setupText = if (Test-Path -LiteralPath $setupLog) {
            Get-Content -LiteralPath $setupLog -Raw
          } else { '' }
          if ($installer.ExitCode -ne 0 -or $setupText -match 'initializer exit code') {
            throw "downloaded installer failed with exit $($installer.ExitCode)`n$setupText"
          }

          $installedExe = Join-Path $install 'ksx.exe'
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
            throw "downloaded setup did not install ksx.exe at fixed path $install"
          }

          # Start only the Program Files binary and require the live provider,
          # product document, and content-hashed script and stylesheet graph.
          $studio = $null
          $studioOut = Join-Path $env:RUNNER_TEMP 'ksx-roundtrip-studio.out.log'
          $studioErr = Join-Path $env:RUNNER_TEMP 'ksx-roundtrip-studio.err.log'
          try {
            $studio = Start-Process -FilePath $installedExe `
              -ArgumentList @('studio', '--port', '4460') `
              -WorkingDirectory $install -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $studioOut `
              -RedirectStandardError $studioErr
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            $healthResponse = $null
            while ([DateTime]::UtcNow -lt $deadline) {
              if ($studio.HasExited) {
                $out = if (Test-Path -LiteralPath $studioOut) {
                  Get-Content -LiteralPath $studioOut -Raw
                } else { '' }
                $err = if (Test-Path -LiteralPath $studioErr) {
                  Get-Content -LiteralPath $studioErr -Raw
                } else { '' }
                throw ("downloaded installed Studio exited $($studio.ExitCode) " +
                       "before health answered`nstdout:`n$out`nstderr:`n$err")
              }
              try {
                $healthResponse = Invoke-WebRequest -UseBasicParsing `
                  -Uri 'http://127.0.0.1:4460/api/health' -TimeoutSec 2
                if ($healthResponse.StatusCode -eq 200) { break }
              }
              catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $healthResponse -or $healthResponse.StatusCode -ne 200) {
              throw 'downloaded installed Studio did not answer /api/health on port 4460'
            }
            $healthContentType = [string]$healthResponse.Headers['Content-Type']
            $healthCacheControl = [string]$healthResponse.Headers['Cache-Control']
            $hasJsonContentType = (
              $healthContentType.Split(';')[0].Trim() -ieq 'application/json'
            )
            $hasNoStore = @(
              $healthCacheControl.Split(',') | Where-Object {
                $_.Trim() -ieq 'no-store'
              }
            ).Count -gt 0
            if (-not $hasJsonContentType -or -not $hasNoStore) {
              throw 'downloaded installed /api/health lost its JSON/no-store contract'
            }
            try {
              $health = $healthResponse.Content | ConvertFrom-Json
            }
            catch {
              throw "downloaded installed /api/health returned invalid JSON: $_"
            }
            $environmentIsLive = $true
            if ([string]$health.environment.id -cne 'live-machine' -or
                [bool]$health.environment.fixture -or
                -not [string]::IsNullOrEmpty([string]$health.environment.generation) -or
                [string]::IsNullOrWhiteSpace([string]$health.environment.label) -or
                [string]::IsNullOrWhiteSpace([string]$health.environment.detail)) {
              $environmentIsLive = $false
            }
            $stagedIsCoherent = if ([bool]$health.staged.reachable) {
              $null -eq $health.staged.error
            } else {
              -not [string]::IsNullOrWhiteSpace([string]$health.staged.error)
            }
            $setupIsCoherent = if ($null -ne $health.setup) {
              -not [string]::IsNullOrWhiteSpace([string]$health.setup.config_root) -and
                [string]::IsNullOrEmpty([string]$health.setup_error)
            } else {
              -not [string]::IsNullOrWhiteSpace([string]$health.setup_error)
            }
            if (-not $environmentIsLive -or
                -not $stagedIsCoherent -or
                -not $setupIsCoherent) {
              throw 'downloaded installed Studio did not satisfy live-machine readiness'
            }

            $redesign = Invoke-WebRequest -UseBasicParsing `
              -Uri 'http://127.0.0.1:4460/redesign' -TimeoutSec 15
            if ($redesign.StatusCode -ne 200 -or
                [string]$redesign.Headers['Content-Type'] -notmatch '^text/html' -or
                $redesign.Content -notmatch 'data-forma-island') {
              throw 'downloaded installed Studio did not serve the /redesign product'
            }
            $assetPaths = @(
              [regex]::Matches(
                $redesign.Content,
                '(?i)(?:src|href)=["''](?<path>/_assets/[^"'']+)["'']'
              ) | ForEach-Object { $_.Groups['path'].Value } | Sort-Object -Unique
            )
            $hashedScripts = @($assetPaths | Where-Object {
              $_ -cmatch '^/_assets/[^/?]+\.[0-9a-f]{8}\.js(?:\?.*)?$'
            })
            $hashedStyles = @($assetPaths | Where-Object {
              $_ -cmatch '^/_assets/[^/?]+\.[0-9a-f]{8}\.css(?:\?.*)?$'
            })
            if ($hashedScripts.Count -lt 1 -or $hashedStyles.Count -lt 1) {
              throw 'downloaded /redesign lacks hashed JavaScript or CSS references'
            }
            foreach ($assetPath in $assetPaths) {
              $assetUri = [Uri]::new(
                [Uri]'http://127.0.0.1:4460/',
                $assetPath
              ).AbsoluteUri
              $asset = Invoke-WebRequest -UseBasicParsing -Uri $assetUri -TimeoutSec 15
              if ($asset.StatusCode -ne 200 -or
                  [string]::IsNullOrEmpty([string]$asset.Content)) {
                throw "downloaded installed Studio asset did not load: $assetPath"
              }
            }
            Write-Host ("downloaded installed runtime smoke: live /api/health, " +
                        "/redesign, $($hashedScripts.Count) hashed JS and " +
                        "$($hashedStyles.Count) hashed CSS asset(s)")
          }
          finally {
            if ($studio -and -not $studio.HasExited) {
              Stop-Process -Id $studio.Id -Force
              Wait-Process -Id $studio.Id -ErrorAction SilentlyContinue
            }
          }

          # Use Inno's installed uninstaller, including its quiesce and owned-
          # recovery gates. No manual directory cleanup may satisfy this proof.
          $uninstallers = @(
            Get-ChildItem -LiteralPath $install -Filter 'unins*.exe' -File
          )
          if ($uninstallers.Count -ne 1) {
            throw "expected one installed uninstaller, found $($uninstallers.Count)"
          }
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'ksx-roundtrip-uninstall.log'
          $uninstallArgs = @(
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            "/LOG=`"$uninstallLog`""
          )
          $uninstaller = Start-Process -FilePath $uninstallers[0].FullName `
            -ArgumentList $uninstallArgs -Wait -PassThru -WindowStyle Hidden
          $uninstallText = if (Test-Path -LiteralPath $uninstallLog) {
            Get-Content -LiteralPath $uninstallLog -Raw
          } else { '' }
          if ($uninstaller.ExitCode -ne 0) {
            throw "downloaded candidate uninstall exited $($uninstaller.ExitCode)`n$uninstallText"
          }
          foreach ($sentinel in @(
            'KSX uninstall gate: session quiesced',
            'KSX uninstall gate: owned recovery released'
          )) {
            if ($uninstallText -notmatch [regex]::Escape($sentinel)) {
              throw "downloaded candidate uninstall did not prove '$sentinel'`n$uninstallText"
            }
          }

          $uninstallDeadline = [DateTime]::UtcNow.AddSeconds(30)
          while ([DateTime]::UtcNow -lt $uninstallDeadline -and
                 ((Test-Path -LiteralPath $install) -or
                  (Test-Path -LiteralPath $programData) -or
                  (Test-Path -LiteralPath $uninstallKey) -or
                  (Test-Path -LiteralPath $startMenuGroup))) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $install) {
            throw "real uninstall left Program Files behind: $install"
          }
          if (Test-Path -LiteralPath $programData) {
            throw "real uninstall left ProgramData behind: $programData"
          }
          if (Test-Path -LiteralPath $uninstallKey) {
            throw "real uninstall left its registration behind: $uninstallKey"
          }
          if (Test-Path -LiteralPath $startMenuGroup) {
            throw "real uninstall left Start-menu shortcuts behind: $startMenuGroup"
          }
          Write-Host 'artifact-store candidate passed real install, boot, and uninstall proof'
