      - name: Fetch the hash-pinned HIDMaestro SDK input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath tools/hidmaestro-probe/sdk.lock.json -Raw |
            ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $lock.releaseAsset.fileName
          $expanded = Join-Path $env:RUNNER_TEMP 'hidmaestro-v1.6.1'

          Invoke-WebRequest -Uri $lock.releaseAsset.url -OutFile $archive
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($archiveHash -cne $lock.releaseAsset.sha256) {
            throw "HIDMaestro release archive hash mismatch: $archiveHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $candidates = @(
            Get-ChildItem -LiteralPath $expanded -Recurse -File |
              Where-Object Name -CEQ $lock.coreDll.fileName
          )
          $matches = @(
            $candidates | Where-Object {
              (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash -ceq
                $lock.coreDll.sha256
            }
          )
          if ($matches.Count -ne 1) {
            throw "Expected exactly one hash-pinned HIDMaestro.Core.dll; found $($matches.Count)."
          }
          "HIDMAESTRO_CORE_PATH=$($matches[0].FullName)" >> $env:GITHUB_ENV
          "HIDMAESTRO_ARCHIVE_PATH=$archive" >> $env:GITHUB_ENV
          "HIDMAESTRO_EXPANDED_PATH=$expanded" >> $env:GITHUB_ENV
      - name: Build, statically inventory the pin, then execute SDK-free contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath tools/hidmaestro-probe/sdk.lock.json -Raw |
            ConvertFrom-Json
          $probe = $null

          try {
            & tools/hidmaestro-probe/build.ps1 `
              -DotNet dotnet `
              -SdkDll $env:HIDMAESTRO_CORE_PATH `
              -Configuration Release
            if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro probe build failed.' }

            $outputRoot = 'tools/hidmaestro-probe/bin/Release/net10.0-windows10.0.26100.0/win-x64'
            $probe = Resolve-Path (Join-Path $outputRoot 'ksx-hidmaestro-probe.dll')
            $deps = Get-Content -LiteralPath `
              (Join-Path $outputRoot 'ksx-hidmaestro-probe.deps.json') -Raw
            if ($deps.Contains('HIDMaestro.Core', [StringComparison]::Ordinal)) {
              throw 'The probe runtime graph contains the upstream SDK assembly.'
            }

            Write-Host '::group::HIDMaestro static inventory'
            $stdout = & dotnet $probe inventory
            $inventoryExit = $LASTEXITCODE
            if ($inventoryExit -ne 0) {
              throw "HIDMaestro static inventory failed with exit $inventoryExit."
            }
            $json = $stdout -join "`n"
            try {
              $document = [System.Text.Json.JsonDocument]::Parse($json)
              if ($document.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
                throw 'the root JSON value is not an object'
              }
              $report = $json | ConvertFrom-Json -Depth 100
              if ($report.schemaVersion -ne 1 -or $report.command -cne 'inventory' -or
                  $report.ok -ne $true) {
                throw 'unexpected inventory envelope'
              }
              if ($report.sdkPin.ok -ne $true -or
                  $report.sdkPin.expectedSha256 -cne $lock.coreDll.sha256 -or
                  $report.sdkPin.actualSha256 -cne $lock.coreDll.sha256 -or
                  $report.sdkPin.expectedFileVersion -cne $lock.coreDll.fileVersion -or
                  $report.sdkPin.actualFileVersion -cne $lock.coreDll.fileVersion -or
                  $report.sdkPin.expectedInformationalVersion -cne
                    $lock.coreDll.informationalVersion -or
                  $report.sdkPin.actualInformationalVersion -cne
                    $lock.coreDll.informationalVersion -or
                  @($report.sdkPin.mismatches).Count -ne 0) {
                throw 'the SDK pin report did not match the exact lock'
              }
              $apiChecks = @($report.api.checks)
              if ($report.api.ok -ne $true -or $apiChecks.Count -ne 22 -or
                  @($apiChecks | Where-Object present -ne $true).Count -ne 0) {
                throw 'the exact 22-member CLR API contract did not pass'
              }
              if ($report.catalog.resourceCount -ne 228 -or
                  $report.catalog.deployableCount -ne 130 -or
                  @($report.catalog.profiles).Count -ne 228 -or
                  $report.catalog.catalogSha256 -cne
                    '8F407E6E1C3C241E16CF6BEF387216AD4D1F5DE055A2C4CC041CA16CE7954A6A') {
                throw 'the profile catalog did not match the pinned contract'
              }
              $personas = @($report.ksxPersonaContract.personas)
              if ($report.ksxPersonaContract.ok -ne $true -or
                  $personas.Count -ne 3 -or
                  @($personas | Where-Object { $_.present -ne $true -or $_.passed -ne $true }).Count -ne 0) {
                throw 'the three KSX persona contracts did not pass'
              }
              if ($report.safety.requestsReadOnlySdkOperations -ne $false -or
                  $report.safety.constructsSdkContext -ne $false -or
                  $report.safety.callsDriverLifecycleApis -ne $false -or
                  $report.safety.liveExerciseStatus -cne 'static-only') {
                throw 'the static-only safety contract drifted'
              }
              $document.Dispose()
            } catch {
              throw "HIDMaestro inventory did not emit the exact static contract: $_"
            }
            Write-Host '::endgroup::'
          } finally {
            if (Test-Path -LiteralPath tools/hidmaestro-probe/bin) {
              Get-ChildItem -LiteralPath tools/hidmaestro-probe/bin -Recurse -File |
                Where-Object Name -CEQ 'HIDMaestro.Core.dll' |
                Remove-Item -Force
            }

            $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            foreach ($target in @($env:HIDMAESTRO_ARCHIVE_PATH, $env:HIDMAESTRO_EXPANDED_PATH)) {
              if ([String]::IsNullOrWhiteSpace($target)) { continue }
              $resolvedTarget = [IO.Path]::GetFullPath($target)
              if (!$resolvedTarget.StartsWith(
                  $runnerTemp,
                  [StringComparison]::OrdinalIgnoreCase)) {
                throw "Refusing to clean HIDMaestro input outside RUNNER_TEMP: $resolvedTarget"
              }
              if (Test-Path -LiteralPath $resolvedTarget) {
                Remove-Item -LiteralPath $resolvedTarget -Recurse -Force
              }
            }
            Remove-Item Env:HIDMAESTRO_CORE_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:HIDMAESTRO_ARCHIVE_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:HIDMAESTRO_EXPANDED_PATH -ErrorAction SilentlyContinue
          }

          $remainingSdk = @(
            Get-ChildItem -LiteralPath tools/hidmaestro-probe/bin -Recurse -File |
              Where-Object Name -CEQ 'HIDMaestro.Core.dll'
          )
          if ($remainingSdk.Count -ne 0) {
            throw 'The upstream SDK remained in the executable probe tree.'
          }
          foreach ($name in @(
            'HIDMAESTRO_CORE_PATH',
            'HIDMAESTRO_ARCHIVE_PATH',
            'HIDMAESTRO_EXPANDED_PATH'
          )) {
            if (Test-Path "Env:$name") {
              throw "The upstream SDK environment path remained set: $name"
            }
          }

          foreach ($command in @('protocol', 'simulate-protocol', 'self-test')) {
            $arguments = @($command)
            $label = $command
            Write-Host "::group::HIDMaestro $label"
            $stdout = & dotnet $probe @arguments
            if ($LASTEXITCODE -ne 0) { throw "HIDMaestro $label failed." }
            $json = $stdout -join "`n"
            try {
              $document = [System.Text.Json.JsonDocument]::Parse($json)
              if ($document.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
                throw 'the root JSON value is not an object'
              }
              $report = $json | ConvertFrom-Json -Depth 100
              if ($report.schemaVersion -ne 1) {
                throw "unexpected schemaVersion '$($report.schemaVersion)'"
              }
              if ($report.command -cne $label) {
                throw "unexpected command '$($report.command)'"
              }
              if ($report.ok -ne $true) {
                throw 'the command reported ok=false'
              }
              $document.Dispose()
            } catch {
              throw "HIDMaestro $label did not emit exactly one JSON document: $_"
            }
            Write-Host '::endgroup::'
          }

          $env:CARGO_TARGET_DIR = Join-Path `
            $env:RUNNER_TEMP `
            'ksx-hidmaestro-bootstrap-policy-target'
          cargo fmt `
            --manifest-path tools/hidmaestro-bootstrap-policy/Cargo.toml `
            -- `
            --check
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert HIDMaestro native-bootstrap policy is not formatted.'
          }
          cargo clippy `
            --manifest-path tools/hidmaestro-bootstrap-policy/Cargo.toml `
            --all-targets `
            --locked `
            -- `
            -D warnings
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert HIDMaestro native-bootstrap policy failed strict clippy.'
          }
          cargo test `
            --manifest-path tools/hidmaestro-bootstrap-policy/Cargo.toml `
            --locked
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert HIDMaestro native-bootstrap policy failed.'
          }

          $env:CARGO_TARGET_DIR = Join-Path `
            $env:RUNNER_TEMP `
            'ksx-hidmaestro-feedback-contract-target'
          cargo fmt `
            --manifest-path tools/hidmaestro-feedback-contract/Cargo.toml `
            -- `
            --check
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert DualSense feedback contract is not formatted.'
          }
          cargo clippy `
            --manifest-path tools/hidmaestro-feedback-contract/Cargo.toml `
            --all-targets `
            --locked `
            -- `
            -D warnings
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert DualSense feedback contract failed strict clippy.'
          }
          cargo test `
            --manifest-path tools/hidmaestro-feedback-contract/Cargo.toml `
            --locked
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert DualSense feedback contract failed its golden vectors.'
          }

          # Everything below is deliberately SDK-free. Build the inherited-token
          # apphost only after the upstream archive, extraction, copied DLL and
          # related environment paths have been removed.
          foreach ($name in @(
            'DOTNET_STARTUP_HOOKS',
            'DOTNET_ADDITIONAL_DEPS',
            'DOTNET_SHARED_STORE',
            'CORECLR_ENABLE_PROFILING',
            'CORECLR_PROFILER',
            'CORECLR_PROFILER_PATH',
            'DOTNET_ENABLE_PROFILING',
            'DOTNET_PROFILER',
            'DOTNET_PROFILER_PATH'
          )) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }

          & powershell -NoProfile -ExecutionPolicy Bypass `
            -File tools/hidmaestro-fake-host/test-safety.ps1
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro fake-host safety guard failed.' }

          dotnet build tools/hidmaestro-fake-host/HidMaestroFakeHost.csproj `
            --configuration Release `
            --runtime win-x64 `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro fake-host build failed.' }
          dotnet build tools/hidmaestro-fake-host/tests/HidMaestroFakeHost.PureTests.csproj `
            --configuration Release `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro fake-host pure-test build failed.' }

          $fakeRoot = Resolve-Path `
            'tools/hidmaestro-fake-host/bin/Release/net10.0-windows10.0.26100.0/win-x64'
          $fakeExe = Join-Path $fakeRoot 'ksx-hidmaestro-fake-host.exe'
          if (!(Test-Path -LiteralPath $fakeExe -PathType Leaf)) {
            throw 'The fixed HIDMaestro fake-host apphost was not emitted.'
          }
          $fakeDependencyFiles = @(
            (Join-Path $fakeRoot 'ksx-hidmaestro-fake-host.deps.json')
            'tools/hidmaestro-fake-host/tests/bin/Release/net10.0-windows10.0.26100.0/ksx-hidmaestro-fake-host-pure-tests.deps.json'
            'tools/hidmaestro-fake-host/obj/project.assets.json'
            'tools/hidmaestro-fake-host/tests/obj/project.assets.json'
          )
          foreach ($dependencyFile in $fakeDependencyFiles) {
            if (!(Test-Path -LiteralPath $dependencyFile -PathType Leaf)) {
              throw "Missing fake-host dependency evidence: $dependencyFile"
            }
            $dependencyText = Get-Content -LiteralPath $dependencyFile -Raw
            if ($dependencyText.Contains('HIDMaestro.Core', [StringComparison]::Ordinal)) {
              throw "The SDK-free fake host references HIDMaestro.Core: $dependencyFile"
            }
          }

          $pureTests = Resolve-Path `
            'tools/hidmaestro-fake-host/tests/bin/Release/net10.0-windows10.0.26100.0/ksx-hidmaestro-fake-host-pure-tests.dll'
          $pureStdout = & dotnet $pureTests
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro fake-host pure tests failed.' }
          $pureJson = $pureStdout -join "`n"
          try {
            $pureDocument = [System.Text.Json.JsonDocument]::Parse($pureJson)
            if ($pureDocument.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
              throw 'the root JSON value is not an object'
            }
            $pureReport = $pureJson | ConvertFrom-Json
            if ($pureReport.schemaVersion -ne 1 -or
                $pureReport.command -cne 'fake-host-pure-tests' -or
                $pureReport.passed -ne 10) {
              throw 'unexpected pure-test result'
            }
            $pureDocument.Dispose()
          } catch {
            throw "HIDMaestro fake-host pure tests did not emit the exact result: $_"
          }

          # The fixed Rust launcher resolves only this basename beside its own
          # test executable. Build first, then copy the exact framework-
          # dependent apphost quartet into that test directory.
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'ksx-hidmaestro-s1-6b-target'
          cargo test -p ksx-hidmaestro `
            --features hidmaestro-fake-host-tests `
            --lib `
            --no-run
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro transport test build failed.' }
          $rustTestDirectory = Join-Path $env:CARGO_TARGET_DIR 'debug/deps'
          if (!(Test-Path -LiteralPath $rustTestDirectory -PathType Container)) {
            throw 'The Rust test executable directory was not emitted.'
          }
          foreach ($suffix in @('.exe', '.dll', '.deps.json', '.runtimeconfig.json')) {
            $name = "ksx-hidmaestro-fake-host$suffix"
            $source = Join-Path $fakeRoot $name
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "The fake-host apphost quartet is missing $name."
            }
            Copy-Item -LiteralPath $source -Destination $rustTestDirectory -Force
          }
          cargo test -p ksx-hidmaestro `
            --features hidmaestro-fake-host-tests `
            --lib `
            windows_transport::windows::integration_tests::fixed_cross_language_fake_exercises_authenticated_framing_and_feedback `
            -- `
            --exact `
            --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw 'The authenticated HIDMaestro fake-host transport test failed.'
          }

  # S1.5e is deliberately separate from the source-contract job. It is the
  # only scope authorized to compile the inert candidate, and it never loads,
  # executes, uploads, packages, or grants product authority to that output.
  hidmaestro-artifact-observation:
    needs: hidmaestro-contracts
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Verify the frozen S1.5e observation infrastructure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-NormalizedTextSha256([string] $path) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $path))
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and
                $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "The pinned text '$path' has a UTF-8 BOM."
            }
            $utf8 = [Text.UTF8Encoding]::new($false, $true)
            $raw = $utf8.GetString($bytes)
            if ($raw.Replace("`r`n", '').IndexOf("`r", [StringComparison]::Ordinal) -ge 0) {
              throw "The pinned text '$path' has a bare carriage return."
            }
            $normalized = $raw.Replace("`r`n", "`n").Replace("`r", "`n")
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              $dashed = [BitConverter]::ToString(
                $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($normalized)))
              return $dashed.Replace('-', '')
            } finally {
              $sha.Dispose()
            }
          }
          function ConvertFrom-SingleJsonObject([object[]] $lines, [string] $label) {
            $json = (@($lines | ForEach-Object { [string]$_ }) -join "`n")
            $document = [Text.Json.JsonDocument]::Parse($json)
            try {
              if ($document.RootElement.ValueKind -ne [Text.Json.JsonValueKind]::Object) {
                throw "$label root must be a JSON object."
              }
              return $json | ConvertFrom-Json -Depth 100
            } finally {
              $document.Dispose()
            }
          }
          function Assert-SixClosedGates([object] $gateState, [string] $label) {
            $expected = @(
              'artifactPublicApiAllowlistFrozen',
              'artifactCompileAllowlistFrozen',
              'profileSourceCatalogBound',
              'rawFeedbackDecoderFrozen',
              'driverRuntimeAbiBound',
              'distributionReady'
            )
            $actual = @($gateState.PSObject.Properties.Name)
            if ($actual.Count -ne $expected.Count -or
                @(Compare-Object $expected $actual -CaseSensitive).Count -ne 0) {
              throw "$label gate set is not exact."
            }
            foreach ($name in $expected) {
              if ($gateState.$name -ne $false) {
                throw "$label advanced gate '$name'."
              }
            }
          }

          $lockPath = 'tools/hidmaestro-runtime-candidate/s1_5e/contract.lock.json'
          $verifierPath = 'tools/hidmaestro-runtime-candidate/s1_5e/verify-source-contract.ps1'
          if ((Get-NormalizedTextSha256 $lockPath) -cne
                '103827CA22B03C1E43D3FC2690580EE9B05E9EC4F833A96E52CBEA812B73EC12' -or
              (Get-NormalizedTextSha256 $verifierPath) -cne
                '283F862EB67258D382B1359D48ACB50BA061D4ABE16BEC20E4AEA3893422201E') {
            throw 'The frozen S1.5e observation contract or verifier drifted.'
          }

          $stdout = @(& $verifierPath -WorkspaceRoot $env:GITHUB_WORKSPACE)
          $report = ConvertFrom-SingleJsonObject $stdout 'S1.5e source verifier'
          if ($report.schemaVersion -ne 1 -or
              $report.assurance -cne 'static-source-only-s1.5e-observation-infrastructure' -or
              $report.ok -ne $true -or
              $report.checkCount -ne 276 -or
              $report.passedCount -ne 276 -or
              $report.failedCount -ne 0 -or
              @($report.checks).Count -ne 276 -or
              @($report.checks | Where-Object { $_.passed -ne $true }).Count -ne 0 -or
              $report.observationEstablished -ne $false -or
              $report.candidateBuilt -ne $false -or
              $report.candidateLoaded -ne $false -or
              $report.candidateExecuted -ne $false) {
            throw 'The S1.5e source-only verifier receipt is not exact.'
          }
          Assert-SixClosedGates $report.gateState 'S1.5e source verifier'

      - name: Build twice and inspect inert candidate bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function ConvertFrom-SingleJsonObject([object[]] $lines, [string] $label) {
            $json = (@($lines | ForEach-Object { [string]$_ }) -join "`n")
            $document = [Text.Json.JsonDocument]::Parse($json)
            try {
              if ($document.RootElement.ValueKind -ne [Text.Json.JsonValueKind]::Object) {
                throw "$label root must be a JSON object."
              }
              return [pscustomobject]@{
                Json = $json
                Value = ($json | ConvertFrom-Json -Depth 100)
              }
            } finally {
              $document.Dispose()
            }
          }
          function Assert-SixClosedGates([object] $gateState, [string] $label) {
            $expected = @(
              'artifactPublicApiAllowlistFrozen',
              'artifactCompileAllowlistFrozen',
              'profileSourceCatalogBound',
              'rawFeedbackDecoderFrozen',
              'driverRuntimeAbiBound',
              'distributionReady'
            )
            $actual = @($gateState.PSObject.Properties.Name)
            if ($actual.Count -ne $expected.Count -or
                @(Compare-Object $expected $actual -CaseSensitive).Count -ne 0) {
              throw "$label gate set is not exact."
            }
            foreach ($name in $expected) {
              if ($gateState.$name -ne $false) {
                throw "$label advanced gate '$name'."
              }
            }
          }
          function Assert-ExactRemovedAnalyzers(
              [object[]] $actual,
              [string[]] $expected,
              [string] $label) {
            $observed = @($actual | ForEach-Object {
              if ([string]::IsNullOrWhiteSpace([string]$_.relativePath) -or
                  [long]$_.byteLength -le 0 -or
                  [string]$_.sha256 -cnotmatch '^[A-F0-9]{64}$') {
                throw "$label contains an invalid analyzer identity."
              }
              "{0}|{1}" -f [string]$_.relativePath, [string]$_.sha256
            })
            if ($observed.Count -ne $expected.Count -or
                [string]::Join("`n", $observed) -cne [string]::Join("`n", $expected)) {
              throw "$label does not match the exact removed-analyzer sequence."
            }
          }

          $runner = 'tools/hidmaestro-runtime-candidate/s1_5e/run-actions-proof.ps1'
          $captured = ConvertFrom-SingleJsonObject `
            @(& $runner -WorkspaceRoot $env:GITHUB_WORKSPACE) `
            'S1.5e Actions observation'
          $receipt = $captured.Value
          # Preserve the path-redacted receipt for both success and failure.
          Write-Host $captured.Json
          if ($receipt.schemaVersion -ne 1 -or
              $receipt.ok -ne $true -or
              $receipt.phase -cne 's1.5e-actions-static-artifact-observation' -or
              $receipt.observationEstablished -ne $true -or
              $receipt.actionsRunner.os -cne 'Windows' -or
              $receipt.actionsRunner.dotnetSdk -cne '10.0.400' -or
              $receipt.actionsRunner.upstreamCommit -cne
                '2a0dac0857901a63d365a36dcf99cf50114ca954' -or
              $receipt.actionsRunner.infrastructureNetworkUsedForPinnedFetch -ne $true -or
              $receipt.stage.fileCountPerBuild -ne 241 -or
              $receipt.stage.upstreamSelectedFileCount -ne 229 -or
              $receipt.stage.preRawTreeSha256 -cne $receipt.stage.postRawTreeSha256 -or
              $receipt.stage.preNormalizedTreeSha256 -cne
                $receipt.stage.postNormalizedTreeSha256 -or
              $receipt.stage.upstreamPreRawTreeSha256 -cne
                $receipt.stage.upstreamPostRawTreeSha256 -or
              $receipt.stage.upstreamPreNormalizedTreeSha256 -cne
                $receipt.stage.upstreamPostNormalizedTreeSha256 -or
              $receipt.stage.rootsWereQuiescentAndHashBound -ne $true -or
              $receipt.stage.rootsClaimedImmutable -ne $false -or
              $receipt.determinism.buildCount -ne 2 -or
              $receipt.determinism.exactArtifactByteEquality -ne $true -or
              $receipt.inspectorHost.runtimeTarget -cne
                '.NETCoreApp,Version=v10.0/win-x64' -or
              $receipt.inspectorHost.frameworkName -cne 'Microsoft.NETCore.App' -or
              $receipt.inspectorHost.frameworkVersion -cne '10.0.11' -or
              $receipt.candidateBuilt -ne $true -or
              $receipt.candidateLoaded -ne $false -or
              $receipt.candidateExecuted -ne $false -or
              $receipt.driverTouched -ne $false -or
              $receipt.deviceTouched -ne $false -or
              $receipt.artifactsRetained -ne $false -or
              $receipt.cleanupCompleted -ne $true) {
            throw 'The top-level S1.5e Actions observation receipt is not exact.'
          }
          $packs = $receipt.targetingPacks
          if ($packs.sdkVersionFileSha256 -cne
                '89D0157FDF8D6ACD8A76EA6FC0E3A110BE7BCA5FF2001D0436ADE70DD0A7ADC7' -or
              $packs.sdkToolsetVersionFileSha256 -cne
                '45D078105738431B70271E857D5CE409B8E6F0F891FF9F864CB5FC92546CDDCC' -or
              $packs.sdkBundledVersionsSha256 -cne
                '2D6C1879967A87460C1C712B54B9FE378281DE4D4F7301ECBB8AF923B47C40DD' -or
              $packs.netCoreAppRefVersion -cne '10.0.11' -or
              $packs.netCoreAppRefOriginalFileCount -ne 348 -or
              $packs.netCoreAppRefOriginalRawByteLength -ne 43511590 -or
              $packs.netCoreAppRefSourcePreRawTreeSha256 -cne
                '2347D43291D0F7F10F528B5588A1AC0C4F1287FEB0E9F2D4FA5635CE01A48BF2' -or
              $packs.netCoreAppRefSourcePostRawByteLength -ne 43511590 -or
              $packs.netCoreAppRefSourcePostRawTreeSha256 -cne
                '2347D43291D0F7F10F528B5588A1AC0C4F1287FEB0E9F2D4FA5635CE01A48BF2' -or
              $packs.netCoreAppRefOriginalFrameworkListByteLength -ne 36320 -or
              $packs.netCoreAppRefOriginalFrameworkListSha256 -cne
                '0527031269FF47FCEB1518ECCD9992E75F924881A362754957676C18988263B4' -or
              $packs.netCoreAppRefSanitizedFileCount -ne 342 -or
              $packs.netCoreAppRefSanitizedRawByteLength -ne 41745862 -or
              $packs.netCoreAppRefSanitizedFrameworkListByteLength -ne 34752 -or
              $packs.netCoreAppRefSanitizedFrameworkListSha256 -cne
                'C23E017A615E74F8CD94DAA2FCA3B9F5EDDBDC4C6636A47D6CB4FC5A61EF9006' -or
              $packs.netCoreAppRefSanitizedRawTreeSha256 -cne
                'EF000B960364CC8C39255D3619BA7BF95DA97C0E07B4C029FC9B578E9C1C8276' -or
              $packs.windowsSdkNetRefVersion -cne '10.0.26100.57' -or
              $packs.windowsPackageSha256 -cne
                'EAA0E3B938319F75BEAC5C046C84EF57212C2743E9263E0DB33B2019AB70B524' -or
              $packs.windowsEvidenceFileCount -ne 97 -or
              $packs.windowsEvidenceRawByteLength -ne 67431788 -or
              $packs.windowsEvidencePreRawTreeSha256 -cne
                '29E5F21F61E66A3E4A850454C575181FA21A42F4A9749B2BEC55869FF4E3787F' -or
              $packs.windowsEvidencePostRawByteLength -ne 67431788 -or
              $packs.windowsEvidencePostRawTreeSha256 -cne
                '29E5F21F61E66A3E4A850454C575181FA21A42F4A9749B2BEC55869FF4E3787F' -or
              $packs.windowsOriginalFrameworkListByteLength -ne 942 -or
              $packs.windowsOriginalFrameworkListSha256 -cne
                '5F5DC88A217A01FAD154279EF8760C49C4FF9819E33AD0671D0F110D0B641D04' -or
              $packs.windowsSanitizedFileCount -ne 96 -or
              $packs.windowsSanitizedRawByteLength -ne 66953308 -or
              $packs.windowsSanitizedFrameworkListByteLength -ne 702 -or
              $packs.windowsSanitizedFrameworkListSha256 -cne
                '78770AD71BD625A18FB1128CF0FF1030C4B1594060931246AB68F94A28921388' -or
              $packs.windowsSanitizedRawTreeSha256 -cne
                'E9F9791056DEABD9763FCA005F8604668FF23ACFA875BAB61285CA978BB1D6BA' -or
              $packs.overlayFileCount -ne 438 -or
              $packs.overlayRawByteLength -ne 108699170 -or
              $packs.overlayPreRawTreeSha256 -cne
                'F9125E4730CF4FCB9AB2566F4AEC2928042ADA7A172B6CD242063A831B5CF775' -or
              $packs.overlayPostFileCount -ne 438 -or
              $packs.overlayPostRawByteLength -ne 108699170 -or
              $packs.overlayPostRawTreeSha256 -cne
                'F9125E4730CF4FCB9AB2566F4AEC2928042ADA7A172B6CD242063A831B5CF775' -or
              $packs.effectiveCompilerAnalyzerItemCount -ne 0 -or
              $packs.capturedLogicalCscAnalyzerArgumentCount -ne 0 -or
              $packs.capturedLogicalCscAnalyzerConfigArgumentCount -ne 0 -or
              $packs.capturedLogicalCscAdditionalFileArgumentCount -ne 0 -or
              $packs.capturedLogicalCscResponseFileArgumentCount -ne 0 -or
              $packs.effectiveCompilerAuxiliaryItemCount -ne 0 -or
              $packs.sourceGeneratorExecutionAuthorized -ne $false -or
              $packs.analyzerClosureCheckedPreAndPostForCandidateAndInspector -ne $true -or
              $packs.candidatePackageDownloadFallbacksDisabled -ne $true -or
              $packs.candidatePackageSourcesConfigured -ne 0 -or
              $packs.workloadResolverEnabled -ne $false -or
              $packs.candidateNetworkAuthorized -ne $false) {
            throw 'The exact released-SDK targeting-pack observation is not exact.'
          }
          Assert-ExactRemovedAnalyzers `
            @($packs.netCoreAppRefRemovedAnalyzers) `
            @(
              'analyzers/dotnet/cs/Microsoft.Interop.ComInterfaceGenerator.dll|6AD171126DF1AE4DB0420EDFA9791C2CE2599AF758C506BEAB1F29CC9219FE2B',
              'analyzers/dotnet/cs/Microsoft.Interop.JavaScript.JSImportGenerator.dll|6C06555039E10929673A5EA53CB5CFF7324D292C989D77F0D10DDD56198D6DE1',
              'analyzers/dotnet/cs/Microsoft.Interop.LibraryImportGenerator.dll|AE1A7C7BEE96FCD69C66FF4FC1CD4D5E2C2474E1644EA9547A11048CF648871C',
              'analyzers/dotnet/cs/Microsoft.Interop.SourceGeneration.dll|5EFC03100F5C544F64ACE8D240BB73661D1BDA8B01BD69BC4D1FB24D605F8BB5',
              'analyzers/dotnet/cs/System.Text.Json.SourceGeneration.dll|82CA672F31AD099C9E823B646C27F3A1DA249E3C5574B1DBC4DC76DEE234BD12',
              'analyzers/dotnet/cs/System.Text.RegularExpressions.Generator.dll|D5B18010ED85ABA3C8807BD3CFA01097BF99E1B6460E99B9A26EB74BFCE12B10'
            ) `
            'Core targeting-pack removal evidence'
          Assert-ExactRemovedAnalyzers `
            @($packs.windowsRemovedAnalyzers) `
            @(
              'analyzers/dotnet/cs/WinRT.SourceGenerator.dll|A23601B11FBB36A2DE48960AAD942FBAB26D2F0835F98086CC764F97EA81CBC8'
            ) `
            'Windows targeting-pack removal evidence'
          if ($receipt.inspectorRuntime.version -cne '10.0.11' -or
              $receipt.inspectorRuntime.fileCount -le 0 -or
              $receipt.inspectorRuntime.rawByteLength -le 0 -or
              $receipt.inspectorRuntime.versionFileSha256 -cne
                '13B770DFE2DFC0294F8C5A9CD60198F365745A219878910A572FD85784D3B733' -or
              $receipt.inspectorRuntime.preRawTreeSha256 -cnotmatch '^[A-F0-9]{64}$' -or
              $receipt.inspectorRuntime.preLaunchRawTreeSha256 -cne
                $receipt.inspectorRuntime.preRawTreeSha256 -or
              $receipt.inspectorRuntime.postLaunchRawTreeSha256 -cne
                $receipt.inspectorRuntime.preRawTreeSha256 -or
              $receipt.inspectorRuntime.pathRedacted -ne $true) {
            throw 'The exact byte-inspector runtime observation is not exact.'
          }
          $outputs = @($receipt.determinism.outputs.PSObject.Properties)
          $expectedOutputs = @(
            'HIDMaestro.Core.deps.json',
            'HIDMaestro.Core.dll',
            'HIDMaestro.Core.pdb'
          )
          if ($outputs.Count -ne 3 -or
              @(Compare-Object $expectedOutputs @($outputs.Name) -CaseSensitive).Count -ne 0 -or
              @($outputs | Where-Object {
                $_.Value.byteLength -le 0 -or
                $_.Value.sha256 -cnotmatch '^[0-9A-F]{64}$'
              }).Count -ne 0) {
            throw 'The deterministic output inventory is not exact.'
          }
          if ($receipt.observation.ok -ne $true -or
              $receipt.observation.phase -cne 's1.5e-actions-static-artifact-observation' -or
              $receipt.observation.candidateBuilt -ne $true -or
              $receipt.observation.candidateLoaded -ne $false -or
              $receipt.observation.candidateExecuted -ne $false -or
              $receipt.observation.driverTouched -ne $false -or
              $receipt.observation.deviceTouched -ne $false -or
              $receipt.observation.networkUsedByCandidate -ne $false -or
              $receipt.observation.publicApi.declaredTypeCount -ne 9 -or
              $receipt.observation.publicApi.logicalEntryCount -ne 100 -or
              @($receipt.observation.publicApi.missingTypes).Count -ne 0 -or
              @($receipt.observation.publicApi.unexpectedTypes).Count -ne 0 -or
              @($receipt.observation.publicApi.missingEntries).Count -ne 0 -or
              @($receipt.observation.publicApi.unexpectedEntries).Count -ne 0 -or
              $receipt.observation.publicApi.structuralContractMatched -ne $false -or
              $receipt.observation.resources.count -ne 228 -or
              $receipt.observation.resources.deployableCount -ne 130 -or
              @($receipt.observation.checks | Where-Object { $_.ok -ne $true }).Count -ne 0) {
            throw 'The nested byte-only artifact observation is not exact.'
          }
          Assert-SixClosedGates $receipt.gateState 'S1.5e Actions observation'
          Assert-SixClosedGates $receipt.observation.gateState 'S1.5e byte inspector'

  # The shippable binary and the installer. The steps live in
  # `build-installer.yml` because `release.yml` needs the SAME build — the file
  # a customer downloads must be the file this gate proved, not a second build
  # that happens to use the same command line. That file also carries the long
  # explanation of why a release binary is never compiled on the dev box.
  #
  # Until a tag is pushed this produces CI artifacts, which are perfectly good
  # for us and useless to a customer: reaching one needs a GitHub login and a
  # walk through the Actions tab. `release.yml` is what turns the same two files
  # into a releases-page download (docs/FIRST-RUN.md §1 moment 1).
  release-binary:
    needs: [test, hidmaestro-contracts, hidmaestro-artifact-observation]
    uses: ./.github/workflows/build-installer.yml
    with:
      # Empty on every ordinary push; the tag when release.yml is the caller.
      release_tag: ${{ inputs.release_tag || '' }}
