name: CI

# Every branch, not just main. The dev box's CPU corrupts compute under
# sustained load (see the release-binary job below), so a local gate is slower
# AND less trustworthy than this one: a rustc crash costs a full retry, and a
# clean local run on a different toolchain once meant something different from
# a clean run here. Pushing a feature branch is now how you gate it.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # `release.yml` calls this whole file on a version tag, so a release runs the
  # exact gate every branch runs — same tests, same feature matrix, same build
  # — and then publishes what it built. A release path that skipped this, or
  # that rebuilt the binary its own way, would be shipping something CI never
  # saw.
  workflow_call:
    inputs:
      release_tag:
        description: >
          Set by release.yml to the tag being released, e.g. `v0.2.0`. Empty
          for ordinary CI. Threaded down to build-installer.yml, whose version
          guard refuses to build when the tag and the tree disagree.
        type: string
        default: ''
    outputs:
      setup_name:
        description: The installer's filename, e.g. `ksx-0.2.0-setup.exe`.
        value: ${{ jobs.release-binary.outputs.setup_name }}
      setup_sha256:
        description: SHA-256 of the installer, as built.
        value: ${{ jobs.release-binary.outputs.setup_sha256 }}
      portable_name:
        description: The portable ZIP filename.
        value: ${{ jobs.release-binary.outputs.portable_name }}
      portable_sha256:
        description: SHA-256 of the portable ZIP, as built.
        value: ${{ jobs.release-binary.outputs.portable_sha256 }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the exact compiler; `rustup show` installs it.
      # NOT dtolnay/rust-toolchain: that action exports RUSTUP_TOOLCHAIN, which
      # overrides the pin — and an overridden pin is how local 1.96 and CI 1.97
      # both said "clippy clean" about different diagnostics on 2026-08-07.
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: actions/setup-node@v4
        with:
          # @getforma/core 2.0.0 declares this minimum. Pinning the floor proves
          # the authoring project does not accidentally rely on a newer Node.
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json
      - name: Studio assets reproduce from registry dependencies
        working-directory: studio-ui
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Studio registry install failed' }
          node build.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Studio asset build failed' }
          git -C .. diff --exit-code -- crates/ksx-studio/assets
          if ($LASTEXITCODE -ne 0) {
            throw 'committed Studio assets differ from a clean Forma build'
          }
          $untracked = git -C .. ls-files --others --exclude-standard -- crates/ksx-studio/assets
          if ($untracked) {
            throw "Studio build emitted untracked assets:`n$($untracked -join "`n")"
          }
      - uses: Swatinem/rust-cache@v2
      - name: Format
        # vendored vigem-client keeps upstream formatting; check only our crates.
        # Naming crates individually is how ksx-api, ksx-hidmaestro, ksx-studio,
        # ksx-cabinet and ksx-fuzz went unchecked from the day each was created,
        # so the list is derived instead: every workspace member but the vendor.
        shell: pwsh
        run: |
          $members = cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            Where-Object name -ne 'vigem-client' |
            ForEach-Object { '-p', $_.name }
          Write-Host "fmt: $($members -join ' ')"
          cargo fmt --check @members
      - name: Clippy
        run: cargo clippy --workspace --exclude vigem-client --all-targets -- -D warnings
      - name: Test
        # Driver-touching tests are behind the `cab-tests` feature and never run here.
        # The vendored vigem-client's integration tests need the ViGEmBus driver: compile-check only.
        run: cargo test --workspace --exclude vigem-client
      # `studio` and `cabinet` are independent opt-ins, so the default build
      # compiles neither and CI never saw the code behind them. Three separate
      # breakages reached main that way (87701cd, 4200214, 4135a7b's dead
      # LearnService::refusing), each caught by a local gate CI did not run.
      # Compile every combination the release build can ship.
      #
      # BOTH crates, and that second one is not symmetry for its own sake.
      # `ksx-app` forwards these features to `ksx-backend`, so `-p ksx-app`
      # does enable the backend's gated code — but `--all-targets` only builds
      # ksx-app's OWN test targets, and the unit tests that sit behind those
      # gates now live in ksx-backend beside the code they test. Gating only
      # the CLI would reopen exactly the gap this step exists to close, one
      # crate lower down.
      - name: Feature matrix (clippy, both crates, all four combinations)
        shell: pwsh
        run: |
          foreach ($p in @('ksx-app', 'ksx-backend')) {
            foreach ($f in @('', 'studio', 'cabinet', 'studio,cabinet')) {
              $label = if ($f) { $f } else { '<default>' }
              Write-Host "::group::$p features: $label"
              if ($f) {
                cargo clippy -p $p --all-targets --features $f -- -D warnings
              } else {
                cargo clippy -p $p --all-targets -- -D warnings
              }
              if ($LASTEXITCODE -ne 0) { throw "$p feature combination '$label' failed" }
              Write-Host '::endgroup::'
            }
          }
      # ...and then RUN them. The step above proves the gated code COMPILES in
      # every combination; it does not execute a single one of its tests, and
      # for three of them that was the difference between green and true.
      # `profile_edit`'s fixtures went stale in the 0.2.0 rebuild and sat red
      # from b652579 until 2026-08-12, because `cargo test --workspace` above
      # runs default features, and `crates/ksx-backend/src/lib.rs` gates
      # `pub mod sources;` behind `any(studio, cabinet)` — so those tests were
      # never compiled by the test job, and never run by the clippy job.
      #
      # ONE combination, not four: the gate is `any(...)`, so `studio,cabinet`
      # is the union and enables every gated module at once. Per-combination
      # COMPILATION is already covered above; this exists to execute.
      - name: Test the feature-gated code (the default build compiles none of it)
        shell: pwsh
        run: |
          foreach ($p in @('ksx-app', 'ksx-backend')) {
            Write-Host "::group::$p tests, features studio,cabinet"
            cargo test -p $p --features studio,cabinet
            if ($LASTEXITCODE -ne 0) { throw "$p tests failed with features studio,cabinet" }
            Write-Host '::endgroup::'
          }
      - name: Check vendored vigem-client compiles
        run: cargo check -p vigem-client --all-features

  # Keep the HIDMaestro contract work off the unreliable development CPU too.
  # GitHub's Windows runner is an administrator with UAC disabled, so it must
  # never load or initialize the external SDK assembly. The probe hashes one
  # retained file handle, parses that same image with PEReader/MetadataReader,
  # then deletes every copied SDK byte before running the pure host contracts.
  hidmaestro-contracts:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hidmaestro-contracts
      - uses: actions/setup-dotnet@v4
        with:
          # Match the SDK used to establish the current probe baseline; do not
          # let `LangVersion=latest` silently move under this contract.
          dotnet-version: '10.0.400'
      - name: Verify the hash-pinned runtime source contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-NormalizedTextSha256([string] $path) {
            $raw = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $path))
            $normalized = $raw.Replace("`r`n", "`n").Replace("`r", "`n")
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              $dashed = [BitConverter]::ToString(
                $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($normalized)))
              return $dashed.Replace('-', '')
            } finally {
              $sha.Dispose()
            }
          }

          $lockPath = 'tools/hidmaestro-runtime-candidate/source.lock.json'
          $contractPath = 'tools/hidmaestro-runtime-candidate/candidate-contract.json'
          $runtimeVerifierPath = 'tools/hidmaestro-runtime-candidate/test-source-contract.ps1'
          $apiLockPath = 'tools/hidmaestro-runtime-candidate/api/contract.lock.json'
          $apiVerifierPath = 'tools/hidmaestro-runtime-candidate/api/test-api-contract.ps1'
          $profileLockPath = 'tools/hidmaestro-runtime-candidate/profiles/catalog.lock.json'
          $profileVerifierPath = 'tools/hidmaestro-runtime-candidate/profiles/verify-profile-catalog.ps1'
          $feedbackContractPath = 'tools/hidmaestro-feedback-contract/contract.json'
          $feedbackSourceLockPath = 'tools/hidmaestro-feedback-contract/source.lock.json'
          $feedbackVectorsPath = 'tools/hidmaestro-feedback-contract/golden-vectors.tsv'
          $feedbackManifestPath = 'tools/hidmaestro-feedback-contract/Cargo.toml'
          $feedbackCargoLockPath = 'tools/hidmaestro-feedback-contract/Cargo.lock'
          $feedbackHarnessPath = 'tools/hidmaestro-feedback-contract/src/lib.rs'
          $feedbackReducerPath = 'crates/ksx-hidmaestro/src/dualsense_feedback.rs'
          $feedbackVerifierPath = 'tools/hidmaestro-feedback-contract/test-source-contract.ps1'
          $expectedLockHash = 'F9DF8924F3C84228A1FD0ED646704112B775B06B733DC480E618284D02D715CC'
          $expectedContractHash = '8E02F1A9B64A566845A708B5547547FABBFAB53BCE1073E02D239DE3AF2443A4'
          if ((Get-NormalizedTextSha256 $lockPath) -cne $expectedLockHash -or
              (Get-NormalizedTextSha256 $contractPath) -cne $expectedContractHash -or
              (Get-NormalizedTextSha256 $runtimeVerifierPath) -cne
                '7B4FFF3D8D38D71D9B6AE8E4060495CF8A1B4BC54CCF0AE9E1030FD30C4D77D4') {
            throw 'The complete runtime source lock or inert candidate contract drifted.'
          }
          if ((Get-NormalizedTextSha256 $apiLockPath) -cne
                '83076D8BE3A59261F91D1B2887F48DC88C8C3148E8E72808248F92DAADA67161' -or
              (Get-NormalizedTextSha256 $apiVerifierPath) -cne
                '6142A4CE33849C4B00017B63054075B17F0E490D2BBEC53C1FC5E2435546323E' -or
              (Get-NormalizedTextSha256 $profileLockPath) -cne
                'CBCEC6094D314ED4637BFA1C295E27236C39F784D9FF1D016791CC375FF25B80' -or
              (Get-NormalizedTextSha256 $profileVerifierPath) -cne
                '2F30B356F759121CB3586B27233214BB2298239FCD77EFFAE86C86C839B32773' -or
              (Get-NormalizedTextSha256 $feedbackContractPath) -cne
                '854B0006809AC69CA5BA9CE94DFF097146AAE9E5D9A3C66DA6C56A662DF4D803' -or
              (Get-NormalizedTextSha256 $feedbackSourceLockPath) -cne
                'C3A1D9357CA86FF0BEA7FAFAFDF1F6AA001EC1D3334D0D7C0C0D54690E668917' -or
              (Get-NormalizedTextSha256 $feedbackVectorsPath) -cne
                '8047FA9C913FE8BE416796DFE8A2C81CBAB4643EA959613331FEC01D8326701D' -or
              (Get-NormalizedTextSha256 $feedbackManifestPath) -cne
                '67F111C4F980C8106B26CF5640595E873AF736A5B09EF905F8EB59A57E20DD74' -or
              (Get-NormalizedTextSha256 $feedbackCargoLockPath) -cne
                'EA1D397555EF3105C2FEAB1C2BC86259486C5C5C38771B857F9C86CEFDEF01D8' -or
              (Get-NormalizedTextSha256 $feedbackHarnessPath) -cne
                '38F68F02DAC628D79215ABEC11B051BDA14D113281E7EB9FECD0655585D9FE4C' -or
              (Get-NormalizedTextSha256 $feedbackReducerPath) -cne
                '32C4B46DD36B8E9421FCEF34823C7199C9ADC2155D1609F2D3A58DBE97E0949D' -or
              (Get-NormalizedTextSha256 $feedbackVerifierPath) -cne
                '1DA6D342ACB99981E68F45999A47FCD58C9F5D234EAF35DEACC5E0D1694EE4C0') {
            throw 'A frozen S1.5c API, profile, or feedback source contract drifted.'
          }
          $lock = Get-Content -LiteralPath $lockPath -Raw | ConvertFrom-Json
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          $feedbackContract = Get-Content -LiteralPath $feedbackContractPath -Raw | ConvertFrom-Json
          $expectedRepository = 'https://github.com/hifihedgehog/HIDMaestro'
          $expectedCommit = '2a0dac0857901a63d365a36dcf99cf50114ca954'
          if ($lock.repository -cne $expectedRepository -or
              $lock.tag -cne 'v1.6.1' -or
              $lock.commit -cne $expectedCommit -or
              $lock.checkout.platform -cne 'windows' -or
              $lock.checkout.coreAutocrlf -ne $true) {
            throw 'The source-fetch authority or checkout-byte contract drifted.'
          }
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'hidmaestro-runtime-source'
          $emptyHooks = Join-Path $env:RUNNER_TEMP 'hidmaestro-empty-hooks'
          $emptyGitConfig = Join-Path $env:RUNNER_TEMP 'hidmaestro-empty-gitconfig'
          $linuxSource = Join-Path $env:RUNNER_TEMP 'hid-playstation-dac3e89a.c'
          $sdlSource = Join-Path $env:RUNNER_TEMP 'SDL_hidapi_ps5-b669ac24.c'
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'

          try {
            New-Item -ItemType Directory -Path $sourceRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $emptyHooks -Force | Out-Null
            New-Item -ItemType File -Path $emptyGitConfig -Force | Out-Null
            $env:GIT_CONFIG_NOSYSTEM = '1'
            $env:GIT_CONFIG_GLOBAL = $emptyGitConfig
            git -C $sourceRoot init --quiet --template=$emptyHooks
            if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the inert source checkout.' }
            git -C $sourceRoot `
              -c core.hooksPath=$emptyHooks `
              -c protocol.allow=never `
              -c protocol.https.allow=always `
              fetch `
              --quiet `
              --depth=1 `
              --no-tags `
              $expectedRepository `
              $expectedCommit
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the pinned HIDMaestro source commit.' }
            git -C $sourceRoot `
              -c core.autocrlf=true `
              -c core.eol=crlf `
              -c core.hooksPath=$emptyHooks `
              checkout `
              --quiet `
              --detach `
              FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not check out the pinned HIDMaestro source commit.' }

            $stdout = & powershell -NoProfile -ExecutionPolicy Bypass `
              -File tools/hidmaestro-runtime-candidate/test-source-contract.ps1 `
              -SourceRoot $sourceRoot
            if ($LASTEXITCODE -ne 0) { throw 'The HIDMaestro runtime source contract failed.' }
            $json = $stdout -join "`n"
            try {
              $document = [System.Text.Json.JsonDocument]::Parse($json)
              if ($document.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
                throw 'the root JSON value is not an object'
              }
              $report = $json | ConvertFrom-Json -Depth 20
              $checks = @($report.checks)
              if ($report.schemaVersion -ne 1 -or
                  $report.command -cne 'runtime-source-baseline' -or
                  $report.assurance -cne 'hash-pinned-static-source-facts-only' -or
                  $report.ok -ne $true -or
                  $report.upstreamCommit -cne $lock.commit -or
                  $checks.Count -ne 82 -or
                  @($checks | Where-Object passed -ne $true).Count -ne 0) {
                throw 'the exact 82-check source contract did not pass'
              }
              if ($contract.schemaVersion -ne 1 -or
                  $contract.status -cne 'design-contract-only' -or
                  $contract.upstreamCommit -cne $lock.commit -or
                  $contract.conformanceScope.maximumLiveControllers -ne 1 -or
                  $contract.conformanceScope.controllerIndex -ne 0 -or
                  $contract.conformanceScope.profile.id -cne 'dualsense' -or
                  $contract.conformanceScope.profile.vendorId -ne 1356 -or
                  $contract.conformanceScope.profile.productId -ne 3302 -or
                  $contract.gateState.sourcePublicApiContractFrozen -ne $true -or
                  $contract.gateState.sourceCompilationDispositionFrozen -ne $true -or
                  $contract.gateState.profileSourceManifestFrozen -ne $true -or
                  $contract.gateState.rawFeedbackContractFrozen -ne $true -or
                  $contract.gateState.artifactPublicApiAllowlistFrozen -ne $false -or
                  $contract.gateState.artifactCompileAllowlistFrozen -ne $false -or
                  $contract.gateState.profileSourceCatalogBound -ne $false -or
                  $contract.gateState.rawFeedbackDecoderFrozen -ne $false -or
                  $contract.gateState.driverRuntimeAbiBound -ne $false -or
                  $contract.gateState.distributionReady -ne $false -or
                  $contract.sourceContracts.publicApi.publicTypeCount -ne 9 -or
                  $contract.sourceContracts.publicApi.logicalMemberCount -ne 100 -or
                  $contract.sourceContracts.publicApi.artifactMetadataVerified -ne $false -or
                  $contract.sourceContracts.compilationDisposition.upstreamUnitCount -ne 51 -or
                  $contract.sourceContracts.compilationDisposition.retainedUnchangedCount -ne 1 -or
                  $contract.sourceContracts.compilationDisposition.replacementRequiredCount -ne 13 -or
                  $contract.sourceContracts.compilationDisposition.excludedCount -ne 37 -or
                  $contract.sourceContracts.compilationDisposition.replacementSourcesPresent -ne $false -or
                  $contract.sourceContracts.profileCatalog.profileTreeFileCount -ne 231 -or
                  $contract.sourceContracts.profileCatalog.embeddedProfileSourceCount -ne 228 -or
                  $contract.sourceContracts.profileCatalog.deployableProfileSourceCount -ne 130 -or
                  $contract.sourceContracts.profileCatalog.duplicateProfileIdCount -ne 0 -or
                  $contract.sourceContracts.profileCatalog.releaseDllCatalogBinding -cne 'unresolved' -or
                  $contract.sourceContracts.rawDualSenseFeedback.goldenVectorCount -ne 16 -or
                  $contract.sourceContracts.rawDualSenseFeedback.pureRustDecoderFrozen -ne $true -or
                  $contract.sourceContracts.rawDualSenseFeedback.managedRuntimeAdapterPresent -ne $false -or
                  $contract.sourceContracts.rawDualSenseFeedback.hardwareVerified -ne $false -or
                  $feedbackContract.schemaVersion -ne 1 -or
                  $feedbackContract.contract -cne 's1.5c-dualsense-usb-raw-feedback' -or
                  $feedbackContract.scope.profileId -cne 'dualsense' -or
                  $feedbackContract.scope.connection -cne 'usb' -or
                  $feedbackContract.implementation.goldenVectorCount -ne 16 -or
                  $feedbackContract.implementation.canonicalRustSource -cne
                    '../../crates/ksx-hidmaestro/src/dualsense_feedback.rs' -or
                  $feedbackContract.implementation.workspaceAndHarnessCompileTheSameSource -ne $true -or
                  $contract.sourceContracts.rawDualSenseFeedback.goldenVectorCount -ne
                    $feedbackContract.implementation.goldenVectorCount) {
                throw 'the inert one-DualSense candidate contract drifted'
              }
              $document.Dispose()
            } catch {
              throw "HIDMaestro source audit did not emit the exact inert contract: $_"
            }

            $apiStdout = & powershell -NoProfile -ExecutionPolicy Bypass `
              -File tools/hidmaestro-runtime-candidate/api/test-api-contract.ps1 `
              -SourceRoot $sourceRoot
            if ($LASTEXITCODE -ne 0) { throw 'The HIDMaestro API/source contract failed.' }
            $apiJson = $apiStdout -join "`n"
            try {
              $apiDocument = [System.Text.Json.JsonDocument]::Parse($apiJson)
              if ($apiDocument.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
                throw 'the root JSON value is not an object'
              }
              $apiReport = $apiJson | ConvertFrom-Json -Depth 20
              $apiChecks = @($apiReport.checks)
              if ($apiReport.schemaVersion -ne 1 -or
                  $apiReport.command -cne 'hidmaestro-runtime-api-source-contract' -or
                  $apiReport.assurance -cne
                    'hash-pinned-static-source-and-source-text-consumer-anchors-only' -or
                  $apiReport.ok -ne $true -or
                  $apiReport.upstreamCommit -cne $expectedCommit -or
                  $apiReport.publicTypeCount -ne 9 -or
                  $apiReport.logicalMemberCount -ne 100 -or
                  $apiReport.upstreamUnitCount -ne 51 -or
                  $apiChecks.Count -ne 352 -or
                  @($apiChecks | Where-Object passed -ne $true).Count -ne 0) {
                throw 'the exact 352-check API/source contract did not pass'
              }
              $apiDocument.Dispose()
            } catch {
              throw "HIDMaestro API/source audit did not emit the exact contract: $_"
            }

            $profileStdout = & powershell -NoProfile -ExecutionPolicy Bypass `
              -File tools/hidmaestro-runtime-candidate/profiles/verify-profile-catalog.ps1 `
              -SourceRoot $sourceRoot
            if ($LASTEXITCODE -ne 0) { throw 'The HIDMaestro profile-source contract failed.' }
            $profileJson = $profileStdout -join "`n"
            try {
              $profileDocument = [System.Text.Json.JsonDocument]::Parse($profileJson)
              if ($profileDocument.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
                throw 'the root JSON value is not an object'
              }
              $profileReport = $profileJson | ConvertFrom-Json -Depth 20
              if ($profileReport.schemaVersion -ne 1 -or
                  $profileReport.command -cne 'verify-profile-source-catalog' -or
                  $profileReport.ok -ne $true -or
                  $profileReport.upstreamCommit -cne $expectedCommit -or
                  $profileReport.manifestCanonicalByteLength -ne 99509 -or
                  $profileReport.manifestCanonicalSha256 -cne
                    'CBCEC6094D314ED4637BFA1C295E27236C39F784D9FF1D016791CC375FF25B80' -or
                  $profileReport.counts.profileTreeFiles -ne 231 -or
                  $profileReport.counts.vendorDirectories -ne 32 -or
                  $profileReport.counts.embeddedProfileSources -ne 228 -or
                  $profileReport.counts.excludedProfileData -ne 3 -or
                  $profileReport.counts.deployableEmbeddedProfileSources -ne 130 -or
                  $profileReport.counts.duplicateProfileIds -ne 0 -or
                  $profileReport.sourceCatalogs.allProfileTreeSha256 -cne
                    'A9C8579E0EA32E8421D219C77CB09CF10219099674AD7119837DDCDFEC61A3B6' -or
                  $profileReport.sourceCatalogs.embeddedProfileSourcesSha256 -cne
                    '4273B2DF12CAD9AA6DE5FB87AC7E90FF20C8121035A79231700383639B7B6151' -or
                  $profileReport.releaseDllComparison.countMappingMatches -ne $true -or
                  $profileReport.releaseDllComparison.sourceToReleaseCatalogBinding -cne 'unresolved' -or
                  $profileReport.releaseDllComparison.catalogSha256ReproducedFromSource -ne $false -or
                  $profileReport.releaseDllComparison.verifierInspectedReleaseDll -ne $false -or
                  $profileReport.safety.readAndHashOnly -ne $true -or
                  $profileReport.safety.invokesExternalCommands -ne $false -or
                  $profileReport.safety.buildsOrLoadsUpstreamCode -ne $false -or
                  $profileReport.safety.writesSourceTree -ne $false) {
                throw 'the exact 231/228/130 profile-source contract did not pass'
              }
              $profileDocument.Dispose()
            } catch {
              throw "HIDMaestro profile-source audit did not emit the exact contract: $_"
            }

            Invoke-WebRequest `
              -Uri 'https://raw.githubusercontent.com/torvalds/linux/dac3e89a2c90c2feeb471e1f22a2512ad424b792/drivers/hid/hid-playstation.c' `
              -OutFile $linuxSource
            Invoke-WebRequest `
              -Uri 'https://raw.githubusercontent.com/libsdl-org/SDL/b669ac244e10fbab4734c7389151f7a4e8ac725f/src/joystick/hidapi/SDL_hidapi_ps5.c' `
              -OutFile $sdlSource
            $feedbackStdout = & powershell -NoProfile -ExecutionPolicy Bypass `
              -File tools/hidmaestro-feedback-contract/test-source-contract.ps1 `
              -HidMaestroRoot $sourceRoot `
              -LinuxSource $linuxSource `
              -SdlSource $sdlSource
            if ($LASTEXITCODE -ne 0) { throw 'The DualSense feedback source contract failed.' }
            $feedbackJson = $feedbackStdout -join "`n"
            try {
              $feedbackDocument = [System.Text.Json.JsonDocument]::Parse($feedbackJson)
              if ($feedbackDocument.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
                throw 'the root JSON value is not an object'
              }
              $feedbackReport = $feedbackJson | ConvertFrom-Json -Depth 20
              $feedbackChecks = @($feedbackReport.checks)
              if ($feedbackReport.schemaVersion -ne 1 -or
                  $feedbackReport.contract -cne 's1.5c-dualsense-usb-raw-feedback-source' -or
                  $feedbackReport.total -ne 29 -or
                  $feedbackReport.passed -ne 29 -or
                  $feedbackReport.failed -ne 0 -or
                  $feedbackChecks.Count -ne 29 -or
                  @($feedbackChecks | Where-Object passed -ne $true).Count -ne 0) {
                throw 'the exact 29-check DualSense feedback source contract did not pass'
              }
              $feedbackDocument.Dispose()
            } catch {
              throw "DualSense feedback source audit did not emit the exact contract: $_"
            }
          } finally {
            foreach ($target in @(
              $sourceRoot,
              $emptyHooks,
              $emptyGitConfig,
              $linuxSource,
              $sdlSource
            )) {
              $resolvedTarget = [IO.Path]::GetFullPath($target)
              if (!$resolvedTarget.StartsWith(
                  $runnerTemp,
                  [StringComparison]::OrdinalIgnoreCase)) {
                throw "Refusing to clean source input outside RUNNER_TEMP: $resolvedTarget"
              }
              if (Test-Path -LiteralPath $resolvedTarget) {
                Remove-Item -LiteralPath $resolvedTarget -Recurse -Force
              }
            }
          }
      - name: Fetch the hash-pinned HIDMaestro SDK input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath tools/hidmaestro-probe/sdk.lock.json -Raw |
            ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $lock.releaseAsset.fileName
          $expanded = Join-Path $env:RUNNER_TEMP 'hidmaestro-v1.6.1'

          Invoke-WebRequest -Uri $lock.releaseAsset.url -OutFile $archive
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($archiveHash -cne $lock.releaseAsset.sha256) {
            throw "HIDMaestro release archive hash mismatch: $archiveHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $candidates = @(
            Get-ChildItem -LiteralPath $expanded -Recurse -File |
              Where-Object Name -CEQ $lock.coreDll.fileName
          )
          $matches = @(
            $candidates | Where-Object {
              (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash -ceq
                $lock.coreDll.sha256
            }
          )
          if ($matches.Count -ne 1) {
            throw "Expected exactly one hash-pinned HIDMaestro.Core.dll; found $($matches.Count)."
          }
          "HIDMAESTRO_CORE_PATH=$($matches[0].FullName)" >> $env:GITHUB_ENV
          "HIDMAESTRO_ARCHIVE_PATH=$archive" >> $env:GITHUB_ENV
          "HIDMAESTRO_EXPANDED_PATH=$expanded" >> $env:GITHUB_ENV
      - name: Build, statically inventory the pin, then execute SDK-free contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath tools/hidmaestro-probe/sdk.lock.json -Raw |
            ConvertFrom-Json
          $probe = $null

          try {
            & tools/hidmaestro-probe/build.ps1 `
              -DotNet dotnet `
              -SdkDll $env:HIDMAESTRO_CORE_PATH `
              -Configuration Release
            if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro probe build failed.' }

            $outputRoot = 'tools/hidmaestro-probe/bin/Release/net10.0-windows10.0.26100.0/win-x64'
            $probe = Resolve-Path (Join-Path $outputRoot 'ksx-hidmaestro-probe.dll')
            $deps = Get-Content -LiteralPath `
              (Join-Path $outputRoot 'ksx-hidmaestro-probe.deps.json') -Raw
            if ($deps.Contains('HIDMaestro.Core', [StringComparison]::Ordinal)) {
              throw 'The probe runtime graph contains the upstream SDK assembly.'
            }

            Write-Host '::group::HIDMaestro static inventory'
            $stdout = & dotnet $probe inventory
            $inventoryExit = $LASTEXITCODE
            if ($inventoryExit -ne 0) {
              throw "HIDMaestro static inventory failed with exit $inventoryExit."
            }
            $json = $stdout -join "`n"
            try {
              $document = [System.Text.Json.JsonDocument]::Parse($json)
              if ($document.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
                throw 'the root JSON value is not an object'
              }
              $report = $json | ConvertFrom-Json -Depth 100
              if ($report.schemaVersion -ne 1 -or $report.command -cne 'inventory' -or
                  $report.ok -ne $true) {
                throw 'unexpected inventory envelope'
              }
              if ($report.sdkPin.ok -ne $true -or
                  $report.sdkPin.expectedSha256 -cne $lock.coreDll.sha256 -or
                  $report.sdkPin.actualSha256 -cne $lock.coreDll.sha256 -or
                  $report.sdkPin.expectedFileVersion -cne $lock.coreDll.fileVersion -or
                  $report.sdkPin.actualFileVersion -cne $lock.coreDll.fileVersion -or
                  $report.sdkPin.expectedInformationalVersion -cne
                    $lock.coreDll.informationalVersion -or
                  $report.sdkPin.actualInformationalVersion -cne
                    $lock.coreDll.informationalVersion -or
                  @($report.sdkPin.mismatches).Count -ne 0) {
                throw 'the SDK pin report did not match the exact lock'
              }
              $apiChecks = @($report.api.checks)
              if ($report.api.ok -ne $true -or $apiChecks.Count -ne 22 -or
                  @($apiChecks | Where-Object present -ne $true).Count -ne 0) {
                throw 'the exact 22-member CLR API contract did not pass'
              }
              if ($report.catalog.resourceCount -ne 228 -or
                  $report.catalog.deployableCount -ne 130 -or
                  @($report.catalog.profiles).Count -ne 228 -or
                  $report.catalog.catalogSha256 -cne
                    '8F407E6E1C3C241E16CF6BEF387216AD4D1F5DE055A2C4CC041CA16CE7954A6A') {
                throw 'the profile catalog did not match the pinned contract'
              }
              $personas = @($report.ksxPersonaContract.personas)
              if ($report.ksxPersonaContract.ok -ne $true -or
                  $personas.Count -ne 3 -or
                  @($personas | Where-Object { $_.present -ne $true -or $_.passed -ne $true }).Count -ne 0) {
                throw 'the three KSX persona contracts did not pass'
              }
              if ($report.safety.requestsReadOnlySdkOperations -ne $false -or
                  $report.safety.constructsSdkContext -ne $false -or
                  $report.safety.callsDriverLifecycleApis -ne $false -or
                  $report.safety.liveExerciseStatus -cne 'static-only') {
                throw 'the static-only safety contract drifted'
              }
              $document.Dispose()
            } catch {
              throw "HIDMaestro inventory did not emit the exact static contract: $_"
            }
            Write-Host '::endgroup::'
          } finally {
            if (Test-Path -LiteralPath tools/hidmaestro-probe/bin) {
              Get-ChildItem -LiteralPath tools/hidmaestro-probe/bin -Recurse -File |
                Where-Object Name -CEQ 'HIDMaestro.Core.dll' |
                Remove-Item -Force
            }

            $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            foreach ($target in @($env:HIDMAESTRO_ARCHIVE_PATH, $env:HIDMAESTRO_EXPANDED_PATH)) {
              if ([String]::IsNullOrWhiteSpace($target)) { continue }
              $resolvedTarget = [IO.Path]::GetFullPath($target)
              if (!$resolvedTarget.StartsWith(
                  $runnerTemp,
                  [StringComparison]::OrdinalIgnoreCase)) {
                throw "Refusing to clean HIDMaestro input outside RUNNER_TEMP: $resolvedTarget"
              }
              if (Test-Path -LiteralPath $resolvedTarget) {
                Remove-Item -LiteralPath $resolvedTarget -Recurse -Force
              }
            }
            Remove-Item Env:HIDMAESTRO_CORE_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:HIDMAESTRO_ARCHIVE_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:HIDMAESTRO_EXPANDED_PATH -ErrorAction SilentlyContinue
          }

          $remainingSdk = @(
            Get-ChildItem -LiteralPath tools/hidmaestro-probe/bin -Recurse -File |
              Where-Object Name -CEQ 'HIDMaestro.Core.dll'
          )
          if ($remainingSdk.Count -ne 0) {
            throw 'The upstream SDK remained in the executable probe tree.'
          }
          foreach ($name in @(
            'HIDMAESTRO_CORE_PATH',
            'HIDMAESTRO_ARCHIVE_PATH',
            'HIDMAESTRO_EXPANDED_PATH'
          )) {
            if (Test-Path "Env:$name") {
              throw "The upstream SDK environment path remained set: $name"
            }
          }

          foreach ($command in @('protocol', 'simulate-protocol', 'self-test')) {
            $arguments = @($command)
            $label = $command
            Write-Host "::group::HIDMaestro $label"
            $stdout = & dotnet $probe @arguments
            if ($LASTEXITCODE -ne 0) { throw "HIDMaestro $label failed." }
            $json = $stdout -join "`n"
            try {
              $document = [System.Text.Json.JsonDocument]::Parse($json)
              if ($document.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
                throw 'the root JSON value is not an object'
              }
              $report = $json | ConvertFrom-Json -Depth 100
              if ($report.schemaVersion -ne 1) {
                throw "unexpected schemaVersion '$($report.schemaVersion)'"
              }
              if ($report.command -cne $label) {
                throw "unexpected command '$($report.command)'"
              }
              if ($report.ok -ne $true) {
                throw 'the command reported ok=false'
              }
              $document.Dispose()
            } catch {
              throw "HIDMaestro $label did not emit exactly one JSON document: $_"
            }
            Write-Host '::endgroup::'
          }

          $env:CARGO_TARGET_DIR = Join-Path `
            $env:RUNNER_TEMP `
            'ksx-hidmaestro-bootstrap-policy-target'
          cargo fmt `
            --manifest-path tools/hidmaestro-bootstrap-policy/Cargo.toml `
            -- `
            --check
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert HIDMaestro native-bootstrap policy is not formatted.'
          }
          cargo clippy `
            --manifest-path tools/hidmaestro-bootstrap-policy/Cargo.toml `
            --all-targets `
            --locked `
            -- `
            -D warnings
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert HIDMaestro native-bootstrap policy failed strict clippy.'
          }
          cargo test `
            --manifest-path tools/hidmaestro-bootstrap-policy/Cargo.toml `
            --locked
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert HIDMaestro native-bootstrap policy failed.'
          }

          $env:CARGO_TARGET_DIR = Join-Path `
            $env:RUNNER_TEMP `
            'ksx-hidmaestro-feedback-contract-target'
          cargo fmt `
            --manifest-path tools/hidmaestro-feedback-contract/Cargo.toml `
            -- `
            --check
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert DualSense feedback contract is not formatted.'
          }
          cargo clippy `
            --manifest-path tools/hidmaestro-feedback-contract/Cargo.toml `
            --all-targets `
            --locked `
            -- `
            -D warnings
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert DualSense feedback contract failed strict clippy.'
          }
          cargo test `
            --manifest-path tools/hidmaestro-feedback-contract/Cargo.toml `
            --locked
          if ($LASTEXITCODE -ne 0) {
            throw 'The inert DualSense feedback contract failed its golden vectors.'
          }

          # Everything below is deliberately SDK-free. Build the inherited-token
          # apphost only after the upstream archive, extraction, copied DLL and
          # related environment paths have been removed.
          foreach ($name in @(
            'DOTNET_STARTUP_HOOKS',
            'DOTNET_ADDITIONAL_DEPS',
            'DOTNET_SHARED_STORE',
            'CORECLR_ENABLE_PROFILING',
            'CORECLR_PROFILER',
            'CORECLR_PROFILER_PATH',
            'DOTNET_ENABLE_PROFILING',
            'DOTNET_PROFILER',
            'DOTNET_PROFILER_PATH'
          )) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }

          & powershell -NoProfile -ExecutionPolicy Bypass `
            -File tools/hidmaestro-fake-host/test-safety.ps1
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro fake-host safety guard failed.' }

          dotnet build tools/hidmaestro-fake-host/HidMaestroFakeHost.csproj `
            --configuration Release `
            --runtime win-x64 `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro fake-host build failed.' }
          dotnet build tools/hidmaestro-fake-host/tests/HidMaestroFakeHost.PureTests.csproj `
            --configuration Release `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro fake-host pure-test build failed.' }

          $fakeRoot = Resolve-Path `
            'tools/hidmaestro-fake-host/bin/Release/net10.0-windows10.0.26100.0/win-x64'
          $fakeExe = Join-Path $fakeRoot 'ksx-hidmaestro-fake-host.exe'
          if (!(Test-Path -LiteralPath $fakeExe -PathType Leaf)) {
            throw 'The fixed HIDMaestro fake-host apphost was not emitted.'
          }
          $fakeDependencyFiles = @(
            (Join-Path $fakeRoot 'ksx-hidmaestro-fake-host.deps.json')
            'tools/hidmaestro-fake-host/tests/bin/Release/net10.0-windows10.0.26100.0/ksx-hidmaestro-fake-host-pure-tests.deps.json'
            'tools/hidmaestro-fake-host/obj/project.assets.json'
            'tools/hidmaestro-fake-host/tests/obj/project.assets.json'
          )
          foreach ($dependencyFile in $fakeDependencyFiles) {
            if (!(Test-Path -LiteralPath $dependencyFile -PathType Leaf)) {
              throw "Missing fake-host dependency evidence: $dependencyFile"
            }
            $dependencyText = Get-Content -LiteralPath $dependencyFile -Raw
            if ($dependencyText.Contains('HIDMaestro.Core', [StringComparison]::Ordinal)) {
              throw "The SDK-free fake host references HIDMaestro.Core: $dependencyFile"
            }
          }

          $pureTests = Resolve-Path `
            'tools/hidmaestro-fake-host/tests/bin/Release/net10.0-windows10.0.26100.0/ksx-hidmaestro-fake-host-pure-tests.dll'
          $pureStdout = & dotnet $pureTests
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro fake-host pure tests failed.' }
          $pureJson = $pureStdout -join "`n"
          try {
            $pureDocument = [System.Text.Json.JsonDocument]::Parse($pureJson)
            if ($pureDocument.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
              throw 'the root JSON value is not an object'
            }
            $pureReport = $pureJson | ConvertFrom-Json
            if ($pureReport.schemaVersion -ne 1 -or
                $pureReport.command -cne 'fake-host-pure-tests' -or
                $pureReport.passed -ne 10) {
              throw 'unexpected pure-test result'
            }
            $pureDocument.Dispose()
          } catch {
            throw "HIDMaestro fake-host pure tests did not emit the exact result: $_"
          }

          # The fixed Rust launcher resolves only this basename beside its own
          # test executable. Build first, then copy the exact framework-
          # dependent apphost quartet into that test directory.
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'ksx-hidmaestro-s1-6b-target'
          cargo test -p ksx-hidmaestro `
            --features hidmaestro-fake-host-tests `
            --lib `
            --no-run
          if ($LASTEXITCODE -ne 0) { throw 'HIDMaestro transport test build failed.' }
          $rustTestDirectory = Join-Path $env:CARGO_TARGET_DIR 'debug/deps'
          if (!(Test-Path -LiteralPath $rustTestDirectory -PathType Container)) {
            throw 'The Rust test executable directory was not emitted.'
          }
          foreach ($suffix in @('.exe', '.dll', '.deps.json', '.runtimeconfig.json')) {
            $name = "ksx-hidmaestro-fake-host$suffix"
            $source = Join-Path $fakeRoot $name
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "The fake-host apphost quartet is missing $name."
            }
            Copy-Item -LiteralPath $source -Destination $rustTestDirectory -Force
          }
          cargo test -p ksx-hidmaestro `
            --features hidmaestro-fake-host-tests `
            --lib `
            windows_transport::windows::integration_tests::fixed_cross_language_fake_exercises_authenticated_framing_and_feedback `
            -- `
            --exact `
            --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw 'The authenticated HIDMaestro fake-host transport test failed.'
          }

  # The shippable binary and the installer. The steps live in
  # `build-installer.yml` because `release.yml` needs the SAME build — the file
  # a customer downloads must be the file this gate proved, not a second build
  # that happens to use the same command line. That file also carries the long
  # explanation of why a release binary is never compiled on the dev box.
  #
  # Until a tag is pushed this produces CI artifacts, which are perfectly good
  # for us and useless to a customer: reaching one needs a GitHub login and a
  # walk through the Actions tab. `release.yml` is what turns the same two files
  # into a releases-page download (docs/FIRST-RUN.md §1 moment 1).
  release-binary:
    needs: [test, hidmaestro-contracts]
    uses: ./.github/workflows/build-installer.yml
    with:
      # Empty on every ordinary push; the tag when release.yml is the caller.
      release_tag: ${{ inputs.release_tag || '' }}
