              $s1dChecks = @($s1dReport.checks)
              $s1dGateNames = @($s1dReport.gateState.PSObject.Properties.Name)
              if ($s1dReport.schemaVersion -ne 1 -or
                  $s1dReport.command -cne 'hidmaestro-s1.5d-source-candidate' -or
                  $s1dReport.assurance -cne
                    'hash-pinned-static-candidate-source-and-project-xml-closure-only' -or
                  $s1dReport.ok -ne $true -or
                  $s1dReport.candidateTreeSha256 -cne
                    '4AC8E4AAD314BC44BE9EC629AD85CCAD3739DA85406857520E6E6B9FCFC88393' -or
                  $s1dReport.counts.candidateFiles -ne 12 -or
                  $s1dReport.counts.compileItems -ne 11 -or
                  $s1dReport.counts.embeddedResources -ne 228 -or
                  $s1dReport.counts.deployableProfileSources -ne 130 -or
                  $s1dReport.counts.candidateApiTypes -ne 7 -or
                  $s1dReport.counts.candidateApiEntries -ne 91 -or
                  $s1dReport.counts.goldenVectors -ne 16 -or
                  $s1dReport.counts.inputSourceBlobs -ne 12 -or
                  $s1dReport.counts.inputDescriptorGroups -ne 6 -or
