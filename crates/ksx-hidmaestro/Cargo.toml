[package]
name = "ksx-hidmaestro"
description = "HIDMaestro experiments and a bounded, versioned future host contract."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ksx-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
ksx-platform.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[features]
# Reserved for future tests against an isolated real HIDMaestro installation.
# This build currently has no such tests or reachable install/device lifecycle;
# never add them to ordinary CI or run them on a developer workstation.
cab-tests = []
# Exercises only the fixed, non-elevating inherited-token cross-language fake
# host. This does not expose or select production elevated-host admission.
hidmaestro-fake-host-tests = ["ksx-platform/hidmaestro-fake-host-tests"]
