[package]
name = "ksx-hidmaestro"
description = "Authenticated HIDMaestro host protocol and production DualSense transport."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ksx-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
ksx-platform.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[features]
# Reserved for supervised hardware tests against an isolated real HIDMaestro
# installation. The live product path exists, but destructive/device tests must
# never enter ordinary CI or run on an unsupervised developer workstation.
cab-tests = []
# Exercises only the fixed, non-elevating inherited-token cross-language fake
# host. This does not expose or select production elevated-host admission.
hidmaestro-fake-host-tests = ["ksx-platform/hidmaestro-fake-host-tests"]
